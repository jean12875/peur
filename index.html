<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="LE TEST — réponds sincèrement.">
<title>LE TEST</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#050506; overflow:hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    user-select:none; -webkit-user-select:none;
    touch-action:none;
    overscroll-behavior:none;
  }
  #app{ position:fixed; inset:0; width:100vw; height:100dvh; background:#050506; }
  canvas{ position:absolute; inset:0; display:block; }

  /* ---------- téléviseur ---------- */
  #tvUnit{
    position:absolute; left:50%; top:30%; transform:translate(-50%,-50%);
    width:min(88vw, 380px); z-index:5; display:flex; flex-direction:column; align-items:center;
  }
  #tvBody{
    width:100%; background:#e9e6df; border-radius:10px; padding:4.5% 4.5% 8%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 0 0 2px rgba(0,0,0,0.15);
    display:flex; gap:3%;
    position:relative;
  }
  #tvScreenWrap{
    flex:1; background:#000; border-radius:4px; padding:3%;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
  }
  #tvScreen{
    position:relative; width:100%; aspect-ratio:4/3; background:radial-gradient(ellipse at 50% 30%, #2a5fa0 0%, #0d1f38 75%);
    border-radius:2px; overflow:hidden; display:flex; align-items:center; justify-content:center; padding:8%;
  }
  #tvText{
    color:#dce8fb; font-size:clamp(0.78rem, 3.4vw, 1rem); text-align:center; line-height:1.55em;
    letter-spacing:0.02em; font-weight:500; text-shadow:0 0 6px rgba(150,190,255,0.4);
    z-index:2; transition:opacity 0.25s ease;
  }
  #tvText.corrupt{ color:#ff5b5b; text-shadow:0 0 8px rgba(255,60,60,0.6); }
  .scanlines{
    position:absolute; inset:0; pointer-events:none; z-index:3;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px, transparent 2px, transparent 3px);
    mix-blend-mode:multiply;
  }
  .tvGlow{ position:absolute; inset:0; pointer-events:none; z-index:1; background:radial-gradient(ellipse at 50% 20%, rgba(255,255,255,0.12), transparent 60%); }
  #tvDials{ width:16%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10%; }
  .dial{ width:70%; aspect-ratio:1; border-radius:50%; background:#cfcbc2; box-shadow:inset 0 0 0 2px rgba(0,0,0,0.25), inset 0 2px 3px rgba(0,0,0,0.3); }
  #antenna{
    position:absolute; top:-22%; left:50%; width:60%; height:26%; transform:translateX(-50%);
    pointer-events:none;
  }
  #antenna svg{ width:100%; height:100%; }
  #tvStand{ width:34%; height:14px; background:#3a352e; margin-top:-4px; border-radius:0 0 4px 4px; }
  #tvLegs{ display:flex; gap:60%; width:34%; margin-top:2px; }
  #tvLegs div{ width:6px; height:22px; background:#3a352e; border-radius:0 0 2px 2px; }

  /* ---------- fils + boutons ---------- */
  #wires{ position:absolute; inset:0; z-index:3; pointer-events:none; }
  #buttonRow{
    position:absolute; left:0; right:0; bottom:8vh; z-index:6;
    display:flex; justify-content:center; gap:18vw;
  }
  .bigbtn{
    width:min(22vw, 92px); height:min(22vw, 92px); border-radius:50%;
    border:none; cursor:pointer; font-family:inherit;
    font-size:clamp(0.8rem,3.4vw,1rem); font-weight:800; letter-spacing:0.05em; color:#fff;
    box-shadow: 0 10px 0 rgba(0,0,0,0.45), 0 12px 16px rgba(0,0,0,0.5);
    transition: transform .08s ease, box-shadow .08s ease, filter .3s ease;
  }
  .bigbtn:active{ transform:translateY(6px); box-shadow:0 4px 0 rgba(0,0,0,0.45), 0 6px 10px rgba(0,0,0,0.4); }
  .bigbtn.disabled{ filter:grayscale(0.7) brightness(0.6); pointer-events:none; }
  #btnYes{ background:radial-gradient(circle at 35% 30%, #4bdc72, #1f9e46); }
  #btnNo{ background:radial-gradient(circle at 35% 30%, #ff6a5e, #c62a1f); }

  /* ---------- écrans overlay ---------- */
  #boot{
    position:absolute; inset:0; z-index:80; background:#000; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1em; opacity:1; transition:opacity 1s ease;
  }
  #boot.hidden{ opacity:0; pointer-events:none; }
  #hourglass{ font-size:2.6rem; color:#8fa; animation:flip 1.6s infinite ease-in-out; }
  @keyframes flip{ 0%,40%{ transform:rotate(0);} 50%,90%{ transform:rotate(180deg);} 100%{ transform:rotate(180deg);} }
  #bootLabel{ color:#7a7a7a; font-size:0.75rem; letter-spacing:0.4em; text-transform:uppercase; }

  #veil{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:8vh 6vw; gap:1.1em; color:#cfcfcf; letter-spacing:0.04em;
    background:radial-gradient(ellipse at center, rgba(5,5,8,0.2) 0%, rgba(5,5,8,0.94) 75%);
    transition:opacity 1.2s ease; z-index:70;
  }
  #veil.hidden{ opacity:0; pointer-events:none; }
  .title{ font-size:clamp(2rem, 8vw, 3.4rem); font-weight:200; letter-spacing:0.3em; margin:0; color:#e6e6e6; text-shadow:0 0 18px rgba(255,255,255,0.08); }
  .flavor{ font-size:clamp(0.82rem, 2.5vw, 1rem); font-weight:300; color:#8a8a8a; max-width:32em; line-height:1.6em; min-height:3em; }
  .stat{ font-size:0.76rem; color:#5c5c5c; letter-spacing:0.1em; text-transform:uppercase; }
  .startbtn{
    margin-top:0.6em; padding:0.85em 2.4em; background:transparent; border:1px solid rgba(255,255,255,0.25);
    color:#d8d8d8; font-size:0.85rem; letter-spacing:0.25em; text-transform:uppercase; cursor:pointer; font-family:inherit;
  }
  .startbtn:active{ background:rgba(255,255,255,0.08); }
  .miniline{ position:absolute; bottom:2.2em; left:0; right:0; text-align:center; font-size:0.7rem; color:#4a4a4a; letter-spacing:0.15em; }
  .miniline button{ background:none;border:none;color:#4a4a4a;font-size:0.7rem;letter-spacing:0.15em; text-decoration:underline; cursor:pointer; padding:0.6em; font-family:inherit; }

  #endScreen{
    position:absolute; inset:0; z-index:75; display:flex; align-items:center; justify-content:center;
    background:#000; opacity:0; pointer-events:none; transition:opacity 1.1s ease;
    flex-direction:column; gap:0.7em; text-align:center; padding:6vh 6vw;
  }
  #endScreen.show{ opacity:1; pointer-events:auto; }
  #endTitle{ font-size:clamp(1.3rem,6vw,2.2rem); letter-spacing:0.3em; font-weight:200; }
  #endSub{ color:#666; font-size:0.85rem; letter-spacing:0.08em; max-width:30em; line-height:1.75em; }

  #flashLayer{ position:absolute; inset:0; z-index:90; pointer-events:none; background:#fff; opacity:0; }

  #wallnote{
    position:absolute; left:4vw; bottom:16vh; z-index:2; color:rgba(255,255,255,0.08);
    font-size:0.7rem; max-width:9em; line-height:1.4em; transform:rotate(-2deg);
  }

  #gear{
    position:absolute; top:1em; left:1em; z-index:60; width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:#999;
    display:flex; align-items:center; justify-content:center; font-size:0.9rem; cursor:pointer;
  }

  @media (prefers-reduced-motion: reduce){ #flashLayer{ transition:none; } #hourglass{ animation:none; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="wallnote">quelqu'un a gratté ça dans le mur avant toi. tu ne comprends pas la langue.</div>

  <svg id="wires" viewBox="0 0 100 100" preserveAspectRatio="none">
    <path id="wireL" d="" stroke="#111" stroke-width="0.5" fill="none"/>
    <path id="wireR" d="" stroke="#111" stroke-width="0.5" fill="none"/>
  </svg>

  <div id="tvUnit">
    <div id="antenna"><svg viewBox="0 0 100 100"><line x1="30" y1="100" x2="15" y2="0" stroke="#888" stroke-width="1.5"/><line x1="70" y1="100" x2="88" y2="4" stroke="#888" stroke-width="1.5"/></svg></div>
    <div id="tvBody">
      <div id="tvScreenWrap">
        <div id="tvScreen">
          <div id="tvText"></div>
          <div class="tvGlow"></div>
          <div class="scanlines"></div>
        </div>
      </div>
      <div id="tvDials"><div class="dial"></div><div class="dial"></div></div>
    </div>
    <div id="tvStand"></div>
    <div id="tvLegs"><div></div><div></div></div>
  </div>

  <div id="buttonRow">
    <button class="bigbtn" id="btnYes">OUI</button>
    <button class="bigbtn" id="btnNo">NON</button>
  </div>

  <div id="boot" class="hidden">
    <div id="hourglass">⧗</div>
    <div id="bootLabel">chargement</div>
  </div>

  <div id="veil">
    <div class="title" id="titleText">LE TEST</div>
    <div class="flavor" id="flavorText">assieds-toi. réponds sincèrement. ça ne prendra pas longtemps.</div>
    <div class="stat" id="statText"></div>
    <button class="startbtn" id="startBtn">commencer</button>
    <div class="miniline"><button id="resetBtn">tout oublier</button></div>
  </div>

  <div id="endScreen">
    <div id="endTitle">FIN</div>
    <div id="endSub"></div>
  </div>

  <div id="flashLayer"></div>
  <div id="gear" title="paramètres">☾</div>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   Utilitaires & état persistant
   ============================================================ */
const SAVE_KEY = "letest_save_v1";
const now = () => Date.now();
const REDUCE_MOTION = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function randRange(a,b){ return a + Math.random()*(b-a); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    firstVisit: now(), lastVisit: now(), totalSessions: 0,
    quietEndings: 0, badEndings: 0, reduceEffects: REDUCE_MOTION
  };
}
function writeSave(s){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(s)); }catch(e){} }
let save = loadSave();

function fmtDuration(ms){
  const s = Math.floor(ms/1000);
  if(s < 60) return s + " seconde" + (s===1?"":"s");
  const m = Math.floor(s/60);
  if(m < 60) return m + " minute" + (m===1?"":"s");
  const h = Math.floor(m/60);
  if(h < 24) return h + " heure" + (h===1?"":"s");
  const d = Math.floor(h/24);
  return d + " jour" + (d===1?"":"s");
}

/* ============================================================
   Canvas — ambiance de la pièce
   ============================================================ */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W*DPR); canvas.height = Math.floor(H*DPR);
  canvas.style.width = W+"px"; canvas.style.height = H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layoutWires();
}
window.addEventListener("resize", resize);

/* ============================================================
   Audio (100% procédural)
   ============================================================ */
let actx=null, droneGain=null, noiseGain=null, masterGain=null, noiseSrc=null, lfo=null, lfoGain=null, filter=null;
function ensureAudio(){
  if(actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  actx = new AC();
  masterGain = actx.createGain(); masterGain.gain.value = 0.5;
  masterGain.connect(actx.destination);

  const osc = actx.createOscillator();
  osc.type = "sine"; osc.frequency.value = 52;
  droneGain = actx.createGain(); droneGain.gain.value = 0.035;
  osc.connect(droneGain); droneGain.connect(masterGain);
  osc.start();

  lfo = actx.createOscillator(); lfo.frequency.value = 0.15;
  lfoGain = actx.createGain(); lfoGain.gain.value = 0.025;
  lfo.connect(lfoGain); lfoGain.connect(droneGain.gain);
  lfo.start();

  const bufSize = actx.sampleRate * 2;
  const buf = actx.createBuffer(1, bufSize, actx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1)*0.6;
  noiseSrc = actx.createBufferSource(); noiseSrc.buffer = buf; noiseSrc.loop = true;
  filter = actx.createBiquadFilter(); filter.type = "lowpass"; filter.frequency.value = 260;
  noiseGain = actx.createGain(); noiseGain.gain.value = 0.012;
  noiseSrc.connect(filter); filter.connect(noiseGain); noiseGain.connect(masterGain);
  noiseSrc.start();
}
function setUnease(level){
  if(!actx) return;
  const t = actx.currentTime;
  droneGain.gain.setTargetAtTime(0.03 + level*0.075, t, 0.6);
  noiseGain.gain.setTargetAtTime(0.01 + level*0.06, t, 0.6);
  filter.frequency.setTargetAtTime(220 + level*1200, t, 0.7);
  lfo.frequency.setTargetAtTime(0.15 + level*0.4, t, 1);
}
function whisperSound(intensity){
  if(!actx) return;
  const t = actx.currentTime;
  const bufSize = Math.floor(actx.sampleRate*0.4);
  const buf = actx.createBuffer(1,bufSize,actx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1);
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type = "bandpass";
  f.frequency.setValueAtTime(1600,t);
  f.frequency.exponentialRampToValueAtTime(280, t+0.35);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.13*intensity, t+0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.4);
  src.connect(f); f.connect(g); g.connect(masterGain);
  src.start(t);
}
function clickSound(low){
  if(!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(); o.type="sine";
  o.frequency.setValueAtTime(low?220:520, t);
  const g = actx.createGain(); g.gain.setValueAtTime(0.18,t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.12);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t+0.14);
}
function scareSound(){
  if(!actx) return;
  const t = actx.currentTime;
  const bufSize = Math.floor(actx.sampleRate * 0.6);
  const buf = actx.createBuffer(1, bufSize, actx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1);
  const src = actx.createBufferSource(); src.buffer = buf;
  const g = actx.createGain(); g.gain.setValueAtTime(0.55, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.55);
  const f = actx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=900;
  src.connect(f); f.connect(g); g.connect(masterGain);
  src.start(t);

  const o = actx.createOscillator(); o.type="sawtooth";
  o.frequency.setValueAtTime(220, t);
  o.frequency.exponentialRampToValueAtTime(40, t+0.5);
  const g2 = actx.createGain(); g2.gain.setValueAtTime(0.35, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t+0.6);
  o.connect(g2); g2.connect(masterGain);
  o.start(t); o.stop(t+0.65);

  const o3 = actx.createOscillator(); o3.type="square";
  o3.frequency.setValueAtTime(320, t);
  o3.frequency.exponentialRampToValueAtTime(1500, t+0.15);
  o3.frequency.exponentialRampToValueAtTime(160, t+0.55);
  const g3 = actx.createGain(); g3.gain.setValueAtTime(0.0001, t);
  g3.gain.linearRampToValueAtTime(0.32, t+0.05);
  g3.gain.exponentialRampToValueAtTime(0.0001, t+0.6);
  o3.connect(g3); g3.connect(masterGain);
  o3.start(t); o3.stop(t+0.65);
}
function vibrate(pattern){ if(!save.reduceEffects && navigator.vibrate) navigator.vibrate(pattern); }

/* ============================================================
   Visage procédural (réservé au final "mauvaise fin")
   ============================================================ */
let entitySeed = Math.random()*1000;
function drawFace(x,y,size,alpha,jitter,fillStyle){
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
  ctx.translate(x,y);
  ctx.fillStyle = fillStyle || "#050505";
  ctx.beginPath();
  const pts = 16;
  for(let i=0;i<=pts;i++){
    const a = (i/pts) * Math.PI*2;
    const jr = size*(0.5+0.5*Math.sin(a*2.7+entitySeed)) + (Math.random()-0.5)*jitter;
    const px = Math.cos(a)*jr*0.62;
    const py = Math.sin(a)*jr;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = "#f3f3f3";
  const eyeY = -size*0.08, eyeDX = size*0.22;
  const eyeW = size*0.09*(0.7+Math.random()*0.6), eyeH = size*0.15*(0.6+Math.random()*0.8);
  ctx.beginPath(); ctx.ellipse(-eyeDX,eyeY,eyeW,eyeH,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(eyeDX,eyeY,eyeW*0.8,eyeH*0.9,0,0,Math.PI*2); ctx.fill();

  ctx.fillStyle = "#000";
  ctx.beginPath();
  const mw = size*0.32, my = size*0.28;
  ctx.moveTo(-mw,my);
  for(let i=0;i<=8;i++){
    const px = -mw + (mw*2*i/8);
    const py = my + Math.sin(i*1.7+entitySeed)*size*0.05 + (Math.random()-0.5)*jitter*0.6;
    ctx.lineTo(px,py);
  }
  ctx.lineTo(mw,my+size*0.14); ctx.lineTo(-mw,my+size*0.14);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
let jumpscareUntil = 0, shakeUntil = 0;
function drawJumpscare(){
  ctx.fillStyle = "#000"; ctx.fillRect(0,0,W,H);
  const dur = save.reduceEffects ? 400 : 900;
  const remain = Math.max(0, jumpscareUntil-now());
  const t = 1 - remain/dur;
  const size = Math.min(W,H) * (0.5 + 0.6*Math.min(1,t*3));
  const cx = W/2 + (save.reduceEffects?0:(Math.random()-0.5)*10);
  const cy = H/2 + (save.reduceEffects?0:(Math.random()-0.5)*10);
  if(!save.reduceEffects){
    ctx.globalCompositeOperation = "lighter";
    drawFace(cx-6, cy, size, 0.5, 26, "rgba(255,0,60,0.9)");
    drawFace(cx+6, cy, size, 0.5, 26, "rgba(0,230,255,0.7)");
    ctx.globalCompositeOperation = "source-over";
  }
  drawFace(cx, cy, size, 1, save.reduceEffects?6:22, "#050505");
  if(!save.reduceEffects && Math.random()<0.5){
    ctx.fillStyle = "rgba(255,255,255,0.06)"; ctx.fillRect(0,0,W,H);
  }
}

/* ============================================================
   Rendu de fond (pièce capitonnée + grain + vignette)
   ============================================================ */
let unease = 0; // 0..1, monte avec la progression du test
function drawRoom(){
  ctx.fillStyle = "#3a3d44"; ctx.fillRect(0,0,W,H);

  // dalles capitonnées
  const tile = Math.max(46, Math.min(W,H)/9);
  ctx.strokeStyle = "rgba(0,0,0,0.25)"; ctx.lineWidth = 2;
  for(let y=-tile; y<H+tile; y+=tile){
    for(let x=-tile; x<W+tile; x+=tile){
      const g = ctx.createRadialGradient(x+tile/2,y+tile/2,tile*0.05,x+tile/2,y+tile/2,tile*0.62);
      g.addColorStop(0, "rgba(255,255,255,0.05)");
      g.addColorStop(1, "rgba(0,0,0,0.12)");
      ctx.fillStyle = g;
      ctx.fillRect(x,y,tile,tile);
      ctx.strokeRect(x,y,tile,tile);
    }
  }

  // sol
  const floorY = H*0.78;
  ctx.fillStyle = "#2c2e33";
  ctx.fillRect(0,floorY,W,H-floorY);
  ctx.strokeStyle = "rgba(0,0,0,0.3)"; ctx.lineWidth=1.5;
  const ftile = tile*0.8;
  for(let x=-ftile; x<W+ftile; x+=ftile){
    ctx.beginPath(); ctx.moveTo(x,floorY); ctx.lineTo(x,H); ctx.stroke();
  }

  if(!save.reduceEffects){
    const grainCount = Math.floor(20 + unease*90);
    ctx.fillStyle = "rgba(255,255,255,0.03)";
    for(let i=0;i<grainCount;i++){
      ctx.fillRect(Math.random()*W, Math.random()*H, 1, 1);
    }
  }

  // flicker occasionnel de la lumière
  if(lightFlickerUntil > now()){
    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(0,0,W,H);
  }

  // vignette qui s'assombrit avec le malaise
  const cx=W/2, cy=H*0.42;
  const vgn = ctx.createRadialGradient(cx,cy,Math.min(W,H)*0.2,cx,cy,Math.max(W,H)*0.75);
  vgn.addColorStop(0,"rgba(0,0,0,0)");
  vgn.addColorStop(1,`rgba(0,0,0,${0.35+unease*0.45})`);
  ctx.fillStyle = vgn; ctx.fillRect(0,0,W,H);
}
let lightFlickerUntil = 0;
function triggerLightFlicker(){
  lightFlickerUntil = now() + randRange(90,180);
  setTimeout(()=>{ if(Math.random()<0.5){ lightFlickerUntil = now()+randRange(70,140); } }, 220);
}

function drawScene(){
  const shaking = now() < shakeUntil;
  let ox=0, oy=0;
  if(shaking){
    const mag = save.reduceEffects ? 3 : 16;
    ox = (Math.random()-0.5)*mag; oy = (Math.random()-0.5)*mag;
  }
  ctx.save();
  if(shaking) ctx.translate(ox,oy);
  if(now() < jumpscareUntil){
    drawJumpscare();
  } else {
    drawRoom();
  }
  ctx.restore();
}
function loop(){
  requestAnimationFrame(loop);
  drawScene();
}

/* ============================================================
   Fils SVG reliant les boutons au téléviseur
   ============================================================ */
function layoutWires(){
  const tv = document.getElementById("tvBody").getBoundingClientRect();
  const yesBtn = document.getElementById("btnYes").getBoundingClientRect();
  const noBtn = document.getElementById("btnNo").getBoundingClientRect();
  const svg = document.getElementById("wires");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const tvx = tv.left+tv.width*0.5, tvy = tv.bottom-6;
  const set = (id, bx, by)=>{
    const path = document.getElementById(id);
    const midY = (tvy+by)/2;
    path.setAttribute("d", `M ${tvx} ${tvy} C ${tvx} ${midY}, ${bx} ${midY}, ${bx} ${by}`);
  };
  set("wireL", yesBtn.left+yesBtn.width/2, yesBtn.top+4);
  set("wireR", noBtn.left+noBtn.width/2, noBtn.top+4);
}

/* ============================================================
   Les questions — écriture originale
   ============================================================ */
let sessionCount = 0; // rempli au démarrage depuis save.totalSessions
function timeString(){
  const d = new Date();
  return String(d.getHours()).padStart(2,"0")+"h"+String(d.getMinutes()).padStart(2,"0");
}
let batteryLevel = null;
if(navigator.getBattery){
  navigator.getBattery().then(b=>{
    batteryLevel = Math.round(b.level*100);
    b.addEventListener("levelchange", ()=>{ batteryLevel = Math.round(b.level*100); });
  }).catch(()=>{});
}

const QUESTIONS = [
  { text:"Es-tu vivant ?", weight:{yes:1,no:-1} },
  { text:"Comprends-tu ce qu'on te demande ?" },
  { text:"Vois-tu cet écran clairement ?" },
  { text:"Es-tu seul, là où tu es ?" },
  { text:"As-tu déjà répondu à ce genre de question ?" },
  { text:"Te souviens-tu de ton propre nom, là, tout de suite ?" },
  { text: ()=>`Il est ${timeString()}. Est-ce l'heure que tu attendais ?` },
  { text: ()=> batteryLevel!==null ? `Ta batterie est à ${batteryLevel}%. Cela te semble-t-il correct ?` : "Ton appareil te semble-t-il fiable ?" },
  { text:"Sais-tu depuis combien de temps tu es assis là ?" },
  { text:"As-tu remarqué que la lumière vient de changer ?", effect: ()=>triggerLightFlicker() },
  { text:"Tu as déjà répondu à cette question, une fois. T'en souviens-tu ?" },
  { text:"Pourquoi as-tu changé d'avis, depuis la dernière fois ?" },
  { text:"Si tu mentais, maintenant, le saurais-tu ?" },
  { text:"Crois-tu que tes réponses t'appartiennent encore ?" },
  { text:"Entends-tu ce bruit ?", effect: ()=>whisperSound(0.6) },
  { text:"Quelqu'un d'autre pourrait-il répondre à ta place sans que tu le remarques ?" },
  { text:"As-tu vérifié que c'est bien toi qui tiens cet appareil ?" },
  {
    text: ()=> sessionCount<=1 ? "C'est la première fois que tu viens ici. Le savais-tu ?" : `C'est ta ${sessionCount}ᵉ visite ici. Le savais-tu vraiment ?`
  },
  { text:"La porte, derrière toi. L'as-tu vérifiée avant de commencer ?" },
  { text:"Veux-tu vraiment savoir ce qu'il y a derrière cet écran ?", weight:{yes:-1,no:1} },
  { text:"Si on éteignait l'écran maintenant, resterais-tu quand même ?", weight:{yes:1,no:-1} },
  { text:"t̸u̴—n'̷e̸s̶—p̵a̴s̸—s̷e̸u̶l̴", corrupt:true, freeze:1500, effect: ()=>{ triggerLightFlicker(); whisperSound(0.4); } },
  { text:"...ça va. ce n'était rien. prêt pour la suite ?" },
  { text:"Dernière question. Es-tu sûr de vouloir une réponse ?", weight:{yes:-1,no:1}, isLast:true },
];

let qIndex = -1;
let compliance = 0;
let waitingAnswer = false;

/* ============================================================
   Machine du test
   ============================================================ */
function setTvText(text, corrupt){
  const el = document.getElementById("tvText");
  el.textContent = text;
  el.classList.toggle("corrupt", !!corrupt);
}
function setButtonsEnabled(on){
  document.getElementById("btnYes").classList.toggle("disabled", !on);
  document.getElementById("btnNo").classList.toggle("disabled", !on);
}

function nextQuestion(){
  qIndex++;
  if(qIndex >= QUESTIONS.length){ concludeTest(); return; }
  const q = QUESTIONS[qIndex];
  const txt = typeof q.text === "function" ? q.text() : q.text;

  waitingAnswer = false;
  setButtonsEnabled(false);
  setTvText("…", false);
  unease = Math.min(1, qIndex / (QUESTIONS.length-1));
  setUnease(unease);

  const delay = q.freeze || randRange(500,900);
  setTimeout(()=>{
    if(state!==STATE.PLAYING) return;
    setTvText(txt, !!q.corrupt);
    if(q.effect) q.effect();
    waitingAnswer = !q.corrupt;
    setButtonsEnabled(!q.corrupt);
    if(q.corrupt){
      setTimeout(()=>{ if(state===STATE.PLAYING) nextQuestion(); }, q.freeze || 1500);
    }
  }, delay);
}

function answer(isYes){
  if(!waitingAnswer || state!==STATE.PLAYING) return;
  waitingAnswer = false;
  setButtonsEnabled(false);
  clickSound(!isYes);
  vibrate([10]);

  const q = QUESTIONS[qIndex];
  if(q.weight){
    compliance += isYes ? q.weight.yes : q.weight.no;
  }
  if(q.isLast){
    setTimeout(()=>concludeTest(), 500);
    return;
  }
  setTimeout(()=>nextQuestion(), randRange(350,600));
}
document.getElementById("btnYes").addEventListener("click", (e)=>{ e.stopPropagation(); answer(true); });
document.getElementById("btnNo").addEventListener("click", (e)=>{ e.stopPropagation(); answer(false); });
document.getElementById("btnYes").addEventListener("pointerdown",(e)=>e.stopPropagation());
document.getElementById("btnNo").addEventListener("pointerdown",(e)=>e.stopPropagation());

function concludeTest(){
  if(compliance >= 1){ endQuiet(); } else { endJumpscare(); }
}

/* ============================================================
   Fins
   ============================================================ */
const STATE = { TITLE:"title", BOOT:"boot", PLAYING:"playing", END:"end" };
let state = STATE.TITLE;
let sessionStart = 0;

function endQuiet(){
  state = STATE.END;
  save.quietEndings = (save.quietEndings||0)+1;
  save.lastVisit = now();
  writeSave(save);
  setButtonsEnabled(false);
  setTvText("TEST TERMINÉ.", false);
  unease = 0.3; setUnease(unease);

  setTimeout(()=>{
    document.getElementById("endTitle").textContent = "MERCI.";
    document.getElementById("endTitle").style.color = "#8fb0c9";
    document.getElementById("endSub").textContent = "on se revoit bientôt. tu ne sauras pas quand.";
    document.getElementById("endScreen").classList.add("show");
  }, 1200);

  setTimeout(()=>{ whisperSound(0.3); }, 3200);

  setTimeout(()=>{
    document.getElementById("endScreen").classList.remove("show");
    backToTitle();
  }, 6000);
}
function endJumpscare(){
  state = STATE.END;
  save.badEndings = (save.badEndings||0)+1;
  save.lastVisit = now();
  writeSave(save);
  setButtonsEnabled(false);
  setTvText("……", true);

  const jsDuration = save.reduceEffects ? 400 : 900;
  jumpscareUntil = now() + jsDuration;
  shakeUntil = jumpscareUntil;
  scareSound();
  vibrate([0,90,30,90,30,260]);
  flashScreen();

  setTimeout(()=>{
    document.getElementById("endTitle").textContent = "TU N'AURAIS PAS DÛ VOULOIR SAVOIR.";
    document.getElementById("endTitle").style.color = "#8a1f1f";
    document.getElementById("endSub").textContent = "le test recommencera. il recommence toujours.";
    document.getElementById("endScreen").classList.add("show");
  }, 700);

  setTimeout(()=>{
    document.getElementById("endScreen").classList.remove("show");
    backToTitle();
  }, 4600);
}
function flashScreen(){
  const f = document.getElementById("flashLayer");
  if(save.reduceEffects){ f.style.opacity="0.25"; setTimeout(()=>f.style.opacity="0",180); return; }
  let n=0;
  const iv = setInterval(()=>{
    f.style.opacity = (n%2===0) ? "0.9" : "0";
    n++;
    if(n>5){ clearInterval(iv); f.style.opacity="0"; }
  }, 55);
}

/* ============================================================
   Titre — mémoire entre sessions
   ============================================================ */
function buildTitleFlavor(){
  const delta = now() - save.lastVisit;
  let msg;
  if(save.totalSessions === 0){
    msg = "assieds-toi. réponds sincèrement. ça ne prendra pas longtemps.";
  } else if(delta < 60000){
    msg = "tu es revenu tout de suite. il ne t'a pas vu partir.";
  } else if(delta < 3600000){
    msg = "tu es parti " + fmtDuration(delta) + ". la salle t'a attendu, telle quelle.";
  } else if(delta < 86400000){
    msg = "ça fait " + fmtDuration(delta) + ". les questions ont eu le temps de changer.";
  } else {
    msg = "ça fait " + fmtDuration(delta) + ". tu ne devrais peut-être pas revenir.";
  }
  document.getElementById("flavorText").textContent = msg;
  const stat = document.getElementById("statText");
  const parts = [];
  if(save.totalSessions>0) parts.push("tests passés : "+save.totalSessions);
  if(save.badEndings>0) parts.push("mauvaises réponses : "+save.badEndings);
  stat.textContent = parts.join("   ·   ");
}

/* ============================================================
   Transitions
   ============================================================ */
function backToTitle(){
  state = STATE.TITLE;
  buildTitleFlavor();
  document.getElementById("veil").classList.remove("hidden");
}
function startBoot(){
  ensureAudio();
  if(actx && actx.state==="suspended") actx.resume();
  state = STATE.BOOT;
  document.getElementById("veil").classList.add("hidden");
  const boot = document.getElementById("boot");
  boot.classList.remove("hidden");
  setTimeout(()=>{
    boot.classList.add("hidden");
    startTest();
  }, 2000);
}
function startTest(){
  save.totalSessions += 1;
  save.lastVisit = now();
  writeSave(save);
  sessionCount = save.totalSessions;

  state = STATE.PLAYING;
  sessionStart = now();
  qIndex = -1;
  compliance = 0;
  unease = 0; setUnease(0);
  entitySeed = Math.random()*1000;
  jumpscareUntil = 0; shakeUntil = 0;
  lightFlickerUntil = 0;

  resize();
  requestAnimationFrame(()=>layoutWires());
  nextQuestion();
}

document.getElementById("startBtn").addEventListener("click", (e)=>{
  e.stopPropagation();
  startBoot();
});
document.getElementById("resetBtn").addEventListener("click", (e)=>{
  e.stopPropagation();
  try{ localStorage.removeItem(SAVE_KEY); }catch(err){}
  save = loadSave();
  buildTitleFlavor();
});
document.getElementById("gear").addEventListener("click", (e)=>{
  e.stopPropagation();
  save.reduceEffects = !save.reduceEffects;
  writeSave(save);
});

/* ============================================================
   Sauvegarde périodique + service worker
   ============================================================ */
setInterval(()=>{
  if(state===STATE.PLAYING){ save.lastVisit = now(); writeSave(save); }
}, 5000);
window.addEventListener("beforeunload", ()=>{ save.lastVisit = now(); writeSave(save); });

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

/* Init */
resize();
requestAnimationFrame(()=>layoutWires());
buildTitleFlavor();
requestAnimationFrame(loop);

})();
</script>
