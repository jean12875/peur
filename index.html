<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="LE TEST — réponds sincèrement.">
<title>LE TEST</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#050506; overflow:hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    user-select:none; -webkit-user-select:none;
    touch-action:none;
    overscroll-behavior:none;
  }
  #app{ position:fixed; inset:0; width:100vw; height:100dvh; background:#d9d4c6; overflow:hidden; cursor:grab; }
  #app.panning{ cursor:grabbing; }
  canvas{ position:absolute; inset:0; display:block; }

  /* ---------- scène pivotable — glisser à gauche/droite pour regarder la pièce ---------- */
  #scene{
    position:absolute; inset:0; transition:transform .35s ease; will-change:transform;
  }
  #scene.dragging{ transition:none; }

  /* ---------- téléviseur ---------- */
  #tvUnit{
    position:absolute; left:50%; top:30%;
    width:min(88vw, 380px); z-index:5; display:flex; flex-direction:column; align-items:center;
    transition:transform .35s ease; will-change:transform;
  }
  #tvUnit.dragging{ transition:none; }
  #tvBody{
    width:100%; background:#e9e6df; border-radius:10px; padding:4.5% 4.5% 8%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 0 0 2px rgba(0,0,0,0.15);
    display:flex; gap:3%;
    position:relative;
  }
  #tvScreenWrap{
    flex:1; background:#000; border-radius:4px; padding:3%;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
  }
  #tvScreen{
    position:relative; width:100%; aspect-ratio:4/3; background:radial-gradient(ellipse at 50% 30%, #2a5fa0 0%, #0d1f38 75%);
    border-radius:2px; overflow:hidden; display:flex; align-items:center; justify-content:center; padding:8%;
  }
  #tvText{
    color:#dce8fb; font-size:clamp(0.78rem, 3.4vw, 1rem); text-align:center; line-height:1.55em;
    letter-spacing:0.02em; font-weight:500; text-shadow:0 0 6px rgba(150,190,255,0.4);
    z-index:2; transition:opacity 0.25s ease;
  }
  #tvText.corrupt{ color:#ff5b5b; text-shadow:0 0 8px rgba(255,60,60,0.6); }
  .scanlines{
    position:absolute; inset:0; pointer-events:none; z-index:3;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px, transparent 2px, transparent 3px);
    mix-blend-mode:multiply;
  }
  .tvGlow{ position:absolute; inset:0; pointer-events:none; z-index:1; background:radial-gradient(ellipse at 50% 20%, rgba(255,255,255,0.12), transparent 60%); }
  #tvDials{ width:16%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10%; }
  .dial{ width:70%; aspect-ratio:1; border-radius:50%; background:#cfcbc2; box-shadow:inset 0 0 0 2px rgba(0,0,0,0.25), inset 0 2px 3px rgba(0,0,0,0.3); }
  #antenna{
    position:absolute; top:-22%; left:50%; width:60%; height:26%; transform:translateX(-50%);
    pointer-events:none;
  }
  #antenna svg{ width:100%; height:100%; }
  #tvStand{ width:34%; height:14px; background:#3a352e; margin-top:-4px; border-radius:0 0 4px 4px; }
  #tvLegs{ display:flex; gap:60%; width:34%; margin-top:2px; }
  #tvLegs div{ width:6px; height:22px; background:#3a352e; border-radius:0 0 2px 2px; }

  /* ---------- fils + boutons ---------- */
  #wires{ position:absolute; inset:0; z-index:3; pointer-events:none; }
  #buttonRow{
    position:absolute; left:0; right:0; bottom:8vh; z-index:6;
    display:flex; justify-content:center; gap:18vw;
  }
  .bigbtn{
    width:min(22vw, 92px); height:min(22vw, 92px); border-radius:50%;
    border:none; cursor:pointer; font-family:inherit;
    font-size:clamp(0.8rem,3.4vw,1rem); font-weight:800; letter-spacing:0.05em; color:#fff;
    box-shadow: 0 10px 0 rgba(0,0,0,0.45), 0 12px 16px rgba(0,0,0,0.5);
    transition: transform .08s ease, box-shadow .08s ease, filter .3s ease;
  }
  .bigbtn:active{ transform:translateY(6px); box-shadow:0 4px 0 rgba(0,0,0,0.45), 0 6px 10px rgba(0,0,0,0.4); }
  .bigbtn.disabled{ filter:grayscale(0.7) brightness(0.6); pointer-events:none; }
  #btnYes{ background:radial-gradient(circle at 35% 30%, #4bdc72, #1f9e46); }
  #btnNo{ background:radial-gradient(circle at 35% 30%, #ff6a5e, #c62a1f); }
  #buttonRow.hide{ display:none; }

  /* ---------- saisie du nom (une seule fois, mémorisée) ---------- */
  #nameRow{
    position:absolute; left:0; right:0; bottom:8vh; z-index:6; display:none;
    justify-content:center; align-items:center; gap:0.6em; padding:0 8vw;
  }
  #nameRow.show{ display:flex; }
  #nameField{
    flex:1; max-width:220px; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.25);
    color:#e6e6e6; font-family:inherit; font-size:0.92rem; padding:0.75em 0.9em; border-radius:4px;
    text-align:center; letter-spacing:0.02em; user-select:text; -webkit-user-select:text;
  }
  #nameField:focus{ outline:none; border-color:rgba(255,255,255,0.5); }
  #nameConfirm{
    width:44px; height:44px; border-radius:50%; border:1px solid rgba(255,255,255,0.25);
    background:transparent; color:#ddd; font-size:1rem; cursor:pointer; font-family:inherit; flex-shrink:0;
  }

  /* ---------- faux paradis puis rouge ---------- */
  #heavenOverlay{
    position:absolute; inset:0; z-index:40; background:#fff; opacity:0; pointer-events:none;
    transition:opacity 1.3s ease, background-color .2s ease;
  }
  #heavenOverlay.show{ opacity:1; }
  #heavenOverlay.hell{ background:#4a0808; }

  /* ---------- écrans overlay ---------- */
  #boot{
    position:absolute; inset:0; z-index:80; background:#000; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1em; opacity:1; transition:opacity 1s ease;
  }
  #boot.hidden{ opacity:0; pointer-events:none; }
  #hourglass{ font-size:2.6rem; color:#8fa; animation:flip 1.6s infinite ease-in-out; }
  @keyframes flip{ 0%,40%{ transform:rotate(0);} 50%,90%{ transform:rotate(180deg);} 100%{ transform:rotate(180deg);} }
  #bootLabel{ color:#7a7a7a; font-size:0.75rem; letter-spacing:0.4em; text-transform:uppercase; }

  #veil{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:8vh 6vw; gap:1.1em; color:#cfcfcf; letter-spacing:0.04em;
    background:radial-gradient(ellipse at center, rgba(5,5,8,0.2) 0%, rgba(5,5,8,0.94) 75%);
    transition:opacity 1.2s ease; z-index:70;
  }
  #veil.hidden{ opacity:0; pointer-events:none; }
  .title{ font-size:clamp(2rem, 8vw, 3.4rem); font-weight:200; letter-spacing:0.3em; margin:0; color:#e6e6e6; text-shadow:0 0 18px rgba(255,255,255,0.08); }
  .flavor{ font-size:clamp(0.82rem, 2.5vw, 1rem); font-weight:300; color:#8a8a8a; max-width:32em; line-height:1.6em; min-height:3em; }
  .stat{ font-size:0.76rem; color:#5c5c5c; letter-spacing:0.1em; text-transform:uppercase; }
  .startbtn{
    margin-top:0.6em; padding:0.85em 2.4em; background:transparent; border:1px solid rgba(255,255,255,0.25);
    color:#d8d8d8; font-size:0.85rem; letter-spacing:0.25em; text-transform:uppercase; cursor:pointer; font-family:inherit;
  }
  .startbtn:active{ background:rgba(255,255,255,0.08); }
  .miniline{ position:absolute; bottom:2.2em; left:0; right:0; text-align:center; font-size:0.7rem; color:#4a4a4a; letter-spacing:0.15em; }
  .miniline button{ background:none;border:none;color:#4a4a4a;font-size:0.7rem;letter-spacing:0.15em; text-decoration:underline; cursor:pointer; padding:0.6em; font-family:inherit; }

  #endScreen{
    position:absolute; inset:0; z-index:75; display:flex; align-items:center; justify-content:center;
    background:#000; opacity:0; pointer-events:none; transition:opacity 1.1s ease;
    flex-direction:column; gap:0.7em; text-align:center; padding:6vh 6vw;
  }
  #endScreen.show{ opacity:1; pointer-events:auto; }
  #endTitle{ font-size:clamp(1.3rem,6vw,2.2rem); letter-spacing:0.3em; font-weight:200; }
  #endSub{ color:#666; font-size:0.85rem; letter-spacing:0.08em; max-width:30em; line-height:1.75em; }

  /* notes murales : désormais chacune sur son propre mur (gauche = lit, droite = porte) */
  #wallnote{
    position:absolute; left:8%; bottom:20%; z-index:2; color:rgba(0,0,0,0.16);
    font-size:0.7rem; max-width:9em; line-height:1.4em; transform:rotate(-2deg);
  }
  #wallnoteRight{
    position:absolute; left:8%; bottom:24%; z-index:2; color:rgba(0,0,0,0.14);
    font-size:0.7rem; max-width:9em; line-height:1.4em; transform:rotate(1.5deg);
  }

  #gear{
    position:absolute; top:1em; left:1em; z-index:60; width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:#999;
    display:flex; align-items:center; justify-content:center; font-size:0.9rem; cursor:pointer;
  }

  /* ---------- aperçu caméra permanent ---------- */
  #camWrap{
    position:absolute; bottom:1.2em; right:1.2em; width:72px; height:96px; z-index:16;
    border:1px solid rgba(255,255,255,0.15); overflow:hidden; opacity:0; transition:opacity 1s ease;
    background:#000;
  }
  #camWrap.show{ opacity:0.8; }
  #camWrap video{ width:100%; height:100%; object-fit:cover; filter:grayscale(1) contrast(1.5) brightness(0.6); transform:scaleX(-1); }
  #camWrap .camlabel{ position:absolute; bottom:2px; left:4px; font-size:0.5rem; color:#c0392b; letter-spacing:0.06em; }

  /* ---------- porte d'entrée multi-permissions ---------- */
  #permGate{
    position:absolute; inset:0; z-index:85; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.97);
  }
  #permGate.show{ display:flex; }
  #permGate .box{ display:flex; flex-direction:column; gap:2.4em; align-items:center; }
  #permGrid{ display:flex; flex-wrap:wrap; justify-content:center; gap:1em; max-width:14em; }
  .permBtn{
    width:52px; height:52px; border-radius:50%; border:1px solid rgba(255,255,255,0.22);
    background:transparent; color:#555; font-size:1.15rem; cursor:pointer; font-family:inherit;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .35s ease, color .35s ease, background-color .35s ease;
  }
  .permBtn.pending{ opacity:0.45; }
  .permBtn.granted{ border-color:#4bdc72; color:#4bdc72; background:rgba(75,220,114,0.08); }
  .permBtn.denied{ border-color:#8a3a33; color:#8a3a33; }
  #launchBtn{
    width:78px; height:78px; border-radius:50%; border:1px solid rgba(255,255,255,0.16);
    background:transparent; color:#3a3a3a; font-size:1.4rem; cursor:default; font-family:inherit;
    transition:border-color .4s ease, color .4s ease, background-color .4s ease;
  }
  #launchBtn.ready{ border-color:#4bdc72; color:#4bdc72; background:rgba(75,220,114,0.1); cursor:pointer; }
  #permGateBack{
    position:absolute; top:1.4em; left:1.4em; width:30px; height:30px; border-radius:50%;
    border:none; background:none; color:#3a3a3a; font-size:0.95rem; cursor:pointer;
  }

  @keyframes shake{
    0%{ transform:translate(0,0); }
    20%{ transform:translate(-7px,3px); }
    40%{ transform:translate(6px,-5px); }
    60%{ transform:translate(-5px,-3px); }
    80%{ transform:translate(6px,2px); }
    100%{ transform:translate(0,0); }
  }
  #app.shake{ animation:shake 0.4s linear; }

  @keyframes shakeHard{
    0%{ transform:translate(0,0) rotate(0); }
    15%{ transform:translate(-14px,8px) rotate(-1.2deg); }
    30%{ transform:translate(13px,-10px) rotate(1.1deg); }
    45%{ transform:translate(-12px,-7px) rotate(-0.8deg); }
    60%{ transform:translate(12px,6px) rotate(1deg); }
    75%{ transform:translate(-9px,9px) rotate(-0.6deg); }
    90%{ transform:translate(6px,-4px); }
    100%{ transform:translate(0,0) rotate(0); }
  }
  #app.shakeHard{ animation:shakeHard 0.65s linear; }

  @media (prefers-reduced-motion: reduce){ #hourglass{ animation:none; } #app.shake{ animation:none; } #app.shakeHard{ animation:none; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="scene">
    <div id="wallnote">quelqu'un a gratté ça dans le mur avant toi. tu ne comprends pas la langue.</div>
    <div id="wallnoteRight">il y avait quelqu'un avant toi. il n'est jamais sorti par cette porte.</div>

    <svg id="wires" viewBox="0 0 100 100" preserveAspectRatio="none">
      <path id="wireL" d="" stroke="#111" stroke-width="0.5" fill="none"/>
      <path id="wireR" d="" stroke="#111" stroke-width="0.5" fill="none"/>
    </svg>

    <div id="tvUnit">
      <div id="antenna"><svg viewBox="0 0 100 100"><line x1="30" y1="100" x2="15" y2="0" stroke="#888" stroke-width="1.5"/><line x1="70" y1="100" x2="88" y2="4" stroke="#888" stroke-width="1.5"/></svg></div>
      <div id="tvBody">
        <div id="tvScreenWrap">
          <div id="tvScreen">
            <div id="tvText"></div>
            <div class="tvGlow"></div>
            <div class="scanlines"></div>
          </div>
        </div>
        <div id="tvDials"><div class="dial"></div><div class="dial"></div></div>
      </div>
      <div id="tvStand"></div>
      <div id="tvLegs"><div></div><div></div></div>
    </div>

    <div id="buttonRow">
      <button class="bigbtn" id="btnYes">OUI</button>
      <button class="bigbtn" id="btnNo">NON</button>
    </div>

    <div id="nameRow">
      <input id="nameField" type="text" maxlength="40" autocomplete="off" autocapitalize="words" spellcheck="false">
      <button id="nameConfirm">✓</button>
    </div>
  </div>

  <div id="heavenOverlay"></div>

  <div id="boot" class="hidden">
    <div id="hourglass">⧗</div>
    <div id="bootLabel">chargement</div>
  </div>

  <div id="veil">
    <div class="title" id="titleText">LE TEST</div>
    <div class="flavor" id="flavorText">assieds-toi. réponds sincèrement. ça ne prendra pas longtemps.</div>
    <div class="stat" id="statText"></div>
    <button class="startbtn" id="startBtn">commencer</button>
    <div class="miniline"><button id="resetBtn">tout oublier</button></div>
  </div>

  <div id="endScreen">
    <div id="endTitle">FIN</div>
    <div id="endSub"></div>
  </div>

  <div id="camWrap"><video id="camVideo" autoplay playsinline muted></video><div class="camlabel">● surveillance</div></div>

  <div id="permGate">
    <button id="permGateBack">←</button>
    <div class="box">
      <div id="permGrid">
        <button class="permBtn" data-key="camera"></button>
        <button class="permBtn" data-key="mic"></button>
        <button class="permBtn" data-key="geo"></button>
        <button class="permBtn" data-key="motion"></button>
        <button class="permBtn" data-key="notif"></button>
      </div>
      <button id="launchBtn"></button>
    </div>
  </div>

  <div id="gear" title="paramètres">☾</div>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   Utilitaires & état persistant
   ============================================================ */
const SAVE_KEY = "letest_save_v1";
const now = () => Date.now();
const REDUCE_MOTION = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function randRange(a,b){ return a + Math.random()*(b-a); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    firstVisit: now(), lastVisit: now(), totalSessions: 0,
    quietEndings: 0, badEndings: 0, reduceEffects: REDUCE_MOTION, playerName: null
  };
}
function writeSave(s){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(s)); }catch(e){} }
let save = loadSave();
let playerName = save.playerName || null;

function fmtDuration(ms){
  const s = Math.floor(ms/1000);
  if(s < 60) return s + " seconde" + (s===1?"":"s");
  const m = Math.floor(s/60);
  if(m < 60) return m + " minute" + (m===1?"":"s");
  const h = Math.floor(m/60);
  if(h < 24) return h + " heure" + (h===1?"":"s");
  const d = Math.floor(h/24);
  return d + " jour" + (d===1?"":"s");
}

/* ============================================================
   Canvas — ambiance de la pièce
   ============================================================ */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W*DPR); canvas.height = Math.floor(H*DPR);
  canvas.style.width = W+"px"; canvas.style.height = H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // la largeur a changé : le décalage de la scène (calculé à partir de W) doit être
  // recalculé, sinon la pièce dessinée sur le canvas et la télé/boutons du DOM se désynchronisent.
  if(typeof applyCamPan === "function") applyCamPan();
  else layoutWires();
}
window.addEventListener("resize", resize);

/* ============================================================
   Caméra pivotable — glisser le doigt révèle le reste de la pièce.
   La télé et les boutons sont ancrés dans la pièce (ils glissent
   avec elle, comme de vrais objets qu'on regarde de côté). Le
   décor lui-même (murs, lit, porte, caméra) est dessiné sur le
   canvas avec des lignes de fuite convergentes, pour un vrai effet
   de profondeur sans dépendre de la composition 3D du navigateur.
   ============================================================ */
let camPan = 0; // -1 (extrême gauche) .. 1 (extrême droite)
let dragging = false, dragStartX = 0, dragStartPan = 0, activePointerId = null;
let panRafScheduled = false;
function panShiftPx(){ return W*0.85; }
function applyCamPan(){
  const shift = camPan * panShiftPx();
  document.getElementById("scene").style.transform = `translateX(${shift.toFixed(1)}px)`;
  const tv = document.getElementById("tvUnit");
  const rot = camPan * -16; // léger effet de perspective : l'écran se détourne quand on regarde ailleurs
  tv.style.transform = `translate(-50%,-50%) perspective(900px) rotateY(${rot.toFixed(1)}deg)`;
  layoutWires();
}
// on découple la fréquence des événements tactiles (parfois très élevée) du
// rythme de rendu réel : un seul recalcul par frame, pour un glissement fluide.
function schedulePanUpdate(){
  if(panRafScheduled) return;
  panRafScheduled = true;
  requestAnimationFrame(()=>{
    panRafScheduled = false;
    applyCamPan();
  });
}
function setDragging(on){
  dragging = on;
  document.getElementById("app").classList.toggle("panning", on);
  document.getElementById("scene").classList.toggle("dragging", on);
  document.getElementById("tvUnit").classList.toggle("dragging", on);
}
const appEl = document.getElementById("app");
appEl.addEventListener("pointerdown",(e)=>{
  if(state!==STATE.PLAYING) return;
  if(document.getElementById("nameRow").classList.contains("show")) return;
  if(activePointerId!==null) return; // ignore un second doigt s'il y en a un déjà actif
  activePointerId = e.pointerId;
  try{ appEl.setPointerCapture(e.pointerId); }catch(err){}
  setDragging(true);
  dragStartX = e.clientX;
  dragStartPan = camPan;
});
appEl.addEventListener("pointermove",(e)=>{
  if(!dragging || e.pointerId!==activePointerId) return;
  const delta = (e.clientX - dragStartX) / panShiftPx();
  camPan = Math.max(-1, Math.min(1, dragStartPan + delta));
  schedulePanUpdate();
});
["pointerup","pointercancel","pointerleave"].forEach(ev=>{
  appEl.addEventListener(ev, (e)=>{
    if(e.pointerId!==activePointerId) return;
    activePointerId = null;
    if(dragging) setDragging(false);
  });
});

/* ============================================================
   Audio (100% procédural)
   ============================================================ */
let actx=null, droneGain=null, noiseGain=null, masterGain=null, noiseSrc=null, lfo=null, lfoGain=null, filter=null;
function ensureAudio(){
  if(actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  actx = new AC();
  masterGain = actx.createGain(); masterGain.gain.value = 0.5;
  masterGain.connect(actx.destination);

  const osc = actx.createOscillator();
  osc.type = "sine"; osc.frequency.value = 52;
  droneGain = actx.createGain(); droneGain.gain.value = 0.035;
  osc.connect(droneGain); droneGain.connect(masterGain);
  osc.start();

  lfo = actx.createOscillator(); lfo.frequency.value = 0.15;
  lfoGain = actx.createGain(); lfoGain.gain.value = 0.025;
  lfo.connect(lfoGain); lfoGain.connect(droneGain.gain);
  lfo.start();

  const bufSize = actx.sampleRate * 2;
  const buf = actx.createBuffer(1, bufSize, actx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1)*0.6;
  noiseSrc = actx.createBufferSource(); noiseSrc.buffer = buf; noiseSrc.loop = true;
  filter = actx.createBiquadFilter(); filter.type = "lowpass"; filter.frequency.value = 260;
  noiseGain = actx.createGain(); noiseGain.gain.value = 0.012;
  noiseSrc.connect(filter); filter.connect(noiseGain); noiseGain.connect(masterGain);
  noiseSrc.start();
}
function setUnease(level){
  if(!actx) return;
  const t = actx.currentTime;
  droneGain.gain.setTargetAtTime(0.03 + level*0.075, t, 0.6);
  noiseGain.gain.setTargetAtTime(0.01 + level*0.06, t, 0.6);
  filter.frequency.setTargetAtTime(220 + level*1200, t, 0.7);
  lfo.frequency.setTargetAtTime(0.15 + level*0.4, t, 1);
}
function whisperSound(intensity){
  if(!actx) return;
  const t = actx.currentTime;
  const bufSize = Math.floor(actx.sampleRate*0.4);
  const buf = actx.createBuffer(1,bufSize,actx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1);
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type = "bandpass";
  f.frequency.setValueAtTime(1600,t);
  f.frequency.exponentialRampToValueAtTime(280, t+0.35);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.13*intensity, t+0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.4);
  src.connect(f); f.connect(g); g.connect(masterGain);
  src.start(t);
}
function clickSound(low){
  if(!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(); o.type="sine";
  o.frequency.setValueAtTime(low?220:520, t);
  const g = actx.createGain(); g.gain.setValueAtTime(0.18,t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.12);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t+0.14);
}
function glitchBurstSound(){
  if(!actx) return;
  const t = actx.currentTime;
  const bufSize = Math.floor(actx.sampleRate*0.16);
  const buf = actx.createBuffer(1,bufSize,actx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1);
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 700;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.28, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.16);
  src.connect(f); f.connect(g); g.connect(masterGain);
  src.start(t);

  const o = actx.createOscillator(); o.type="square";
  o.frequency.setValueAtTime(90, t);
  const g2 = actx.createGain(); g2.gain.setValueAtTime(0.12, t);
  g2.gain.exponentialRampToValueAtTime(0.0001, t+0.1);
  o.connect(g2); g2.connect(masterGain);
  o.start(t); o.stop(t+0.11);
}
function heavenSound(){
  if(!actx) return;
  const t = actx.currentTime;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.075, t+0.9);
  g.gain.linearRampToValueAtTime(0.0001, t+2.7);
  g.connect(masterGain);
  // deux paires légèrement désaccordées : un choeur qui sonne presque juste, mais pas tout à fait
  [523.25, 527.4, 659.25, 664.6, 784.0, 789.9].forEach((f)=>{
    const o = actx.createOscillator(); o.type = "sine"; o.frequency.value = f;
    o.connect(g); o.start(t); o.stop(t+2.8);
  });
}
function hellCutSound(){
  if(!actx) return;
  glitchBurstSound();
  const t = actx.currentTime;
  const o = actx.createOscillator(); o.type = "sawtooth";
  o.frequency.setValueAtTime(140, t);
  o.frequency.exponentialRampToValueAtTime(40, t+0.5);
  const g = actx.createGain(); g.gain.setValueAtTime(0.16, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.55);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t+0.56);
}
function vibrate(pattern){ if(!save.reduceEffects && navigator.vibrate) navigator.vibrate(pattern); }

/* ============================================================
   Visage procédural — réservé à de très brefs aperçus furtifs,
   jamais à un jumpscare plein écran
   ============================================================ */
let entitySeed = Math.random()*1000;
function drawFace(x,y,size,alpha,jitter,fillStyle){
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
  ctx.translate(x,y);
  ctx.fillStyle = fillStyle || "#050505";
  ctx.beginPath();
  const pts = 16;
  for(let i=0;i<=pts;i++){
    const a = (i/pts) * Math.PI*2;
    const jr = size*(0.5+0.5*Math.sin(a*2.7+entitySeed)) + (Math.random()-0.5)*jitter;
    const px = Math.cos(a)*jr*0.62;
    const py = Math.sin(a)*jr;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = "#f3f3f3";
  const eyeY = -size*0.08, eyeDX = size*0.22;
  const eyeW = size*0.09*(0.7+Math.random()*0.6), eyeH = size*0.15*(0.6+Math.random()*0.8);
  ctx.beginPath(); ctx.ellipse(-eyeDX,eyeY,eyeW,eyeH,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(eyeDX,eyeY,eyeW*0.8,eyeH*0.9,0,0,Math.PI*2); ctx.fill();

  ctx.fillStyle = "#000";
  ctx.beginPath();
  const mw = size*0.32, my = size*0.28;
  ctx.moveTo(-mw,my);
  for(let i=0;i<=8;i++){
    const px = -mw + (mw*2*i/8);
    const py = my + Math.sin(i*1.7+entitySeed)*size*0.05 + (Math.random()-0.5)*jitter*0.6;
    ctx.lineTo(px,py);
  }
  ctx.lineTo(mw,my+size*0.14); ctx.lineTo(-mw,my+size*0.14);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
let glimpseUntil = 0, glimpseX = 0.5, glimpseY = 0.25;
function triggerGlimpse(){
  glimpseX = randRange(0.28,0.72);
  glimpseY = randRange(0.12,0.32);

}
let redPulseUntil = 0, redPulseDuration = 900, redPulsePeak = 0.32;
function triggerDisturb(severity){
  severity = severity || 1;
  const app = document.getElementById("app");
  const cls = severity>=2 ? "shakeHard" : "shake";
  app.classList.remove("shake","shakeHard");
  void app.offsetWidth; // force le redémarrage de l'animation CSS
  app.classList.add(cls);
  redPulseDuration = severity>=2 ? 1700 : 900;
  redPulsePeak = severity>=2 ? 0.5 : 0.32;
  redPulseUntil = now() + redPulseDuration;
  glitchBurstSound();
  if(severity>=2){ setTimeout(()=>{ if(state===STATE.PLAYING) glitchBurstSound(); }, 160); }
  vibrate(save.reduceEffects ? [20] : (severity>=2 ? [0,50,20,50,20,70] : [0,35,15,35]));
}

/* ============================================================
   Rendu de la pièce (salle d'isolement blanche capitonnée).
   Dessiné en Canvas 2D avec de vraies lignes de fuite convergeant
   vers un point de fuite qui se déplace avec le regard : c'est ce
   qui donne l'impression de profondeur, pas une transformation 3D
   du navigateur (trop fragile à contrôler sans aperçu visuel ici).
   ============================================================ */
let unease = 0; // 0..1, monte avec la progression du test

// positions fixes (en fractions de W) des éléments de la pièce, hors du
// champ de vision par défaut — ils n'apparaissent qu'en glissant vers eux.
const BED_X = -0.55, DOOR_X = 1.55, CAM_X = 1.05;

function perspectiveScale(x, vpX){
  const d = Math.abs(x - vpX);
  return Math.max(0.55, 1 - (d/W)*0.5);
}
function drawBed(cx, floorY, vpX){
  const s = perspectiveScale(cx, vpX);
  ctx.save();
  ctx.translate(cx, floorY);
  ctx.scale(s, s);
  const w = Math.min(230, W*0.5), h = w*0.36;
  const x = -w/2, y = -h*0.95;
  ctx.fillStyle = "rgba(0,0,0,0.14)";
  ctx.fillRect(x+6, y+h*0.72, w-12, h*0.3);
  ctx.fillStyle = "#eeeadd";
  ctx.fillRect(x, y, w, h*0.62);
  ctx.strokeStyle = "rgba(0,0,0,0.14)"; ctx.lineWidth = 1.5;
  ctx.strokeRect(x, y, w, h*0.62);
  ctx.strokeStyle = "rgba(0,0,0,0.08)";
  ctx.beginPath(); ctx.moveTo(x+w*0.14,y+h*0.62); ctx.lineTo(x+w*0.14,y+h*0.08); ctx.stroke();
  ctx.fillStyle = "#fbfaf5";
  ctx.fillRect(x+w*0.05, y+h*0.05, w*0.22, h*0.24);
  ctx.strokeStyle = "rgba(0,0,0,0.1)";
  ctx.strokeRect(x+w*0.05, y+h*0.05, w*0.22, h*0.24);
  ctx.restore();
}
function drawDoor(cx, floorY, vpX){
  const s = perspectiveScale(cx, vpX);
  ctx.save();
  ctx.translate(cx, floorY);
  ctx.scale(s, s);
  const w = Math.min(150, W*0.32), h = w*2.15;
  const x = -w/2, y = -h;
  ctx.fillStyle = "rgba(0,0,0,0.06)";
  ctx.fillRect(x-5, y-5, w+10, h+5);
  ctx.fillStyle = "#e4e0d3"; // presque la teinte du mur : elle se remarque à peine
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = "rgba(0,0,0,0.16)"; ctx.lineWidth = 1.5;
  ctx.strokeRect(x, y, w, h);
  ctx.strokeStyle = "rgba(0,0,0,0.09)";
  ctx.strokeRect(x+w*0.1, y+h*0.06, w*0.8, h*0.88);
  // pas de poignée : juste une trace, là où elle devrait être
  ctx.fillStyle = "rgba(0,0,0,0.07)";
  ctx.beginPath(); ctx.arc(x+w*0.87, y+h*0.5, 3, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawCeilingCamera(cx, topY, vpX){
  const s = perspectiveScale(cx, vpX);
  ctx.save();
  ctx.translate(cx, topY);
  ctx.scale(s, s);
  ctx.fillStyle = "rgba(0,0,0,0.1)";
  ctx.beginPath(); ctx.ellipse(0,4,20,7,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = "#1c1c1c";
  ctx.beginPath(); ctx.ellipse(0,0,16,9,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = "#050505";
  ctx.beginPath(); ctx.arc(0,1,6,0,Math.PI*2); ctx.fill();
  const blink = (Math.sin(now()/600)+1)/2;
  ctx.fillStyle = `rgba(220,30,20,${(0.35+blink*0.5).toFixed(2)})`;
  ctx.beginPath(); ctx.arc(9,-3,2.2,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawRoom(){
  const shiftPx = camPan * panShiftPx();
  const vpX = W/2 + shiftPx;   // le point de fuite suit le regard
  const vpY = H*0.33;
  const floorY = H*0.78;

  ctx.fillStyle = "#d9d4c6"; ctx.fillRect(0,0,W,H);

  // dalles capitonnées — la texture bouge un peu moins vite que la scène,
  // ce qui crée une vraie impression de parallaxe/profondeur au glissement.
  const tile = Math.max(46, Math.min(W,H)/9);
  const pad = panShiftPx() + tile;
  ctx.save();
  ctx.translate(shiftPx*0.45, 0);
  ctx.strokeStyle = "rgba(0,0,0,0.1)"; ctx.lineWidth = 2;
  for(let y=-tile; y<H+tile; y+=tile){
    for(let x=-pad; x<W+pad; x+=tile){
      const g = ctx.createRadialGradient(x+tile/2,y+tile/2,tile*0.05,x+tile/2,y+tile/2,tile*0.62);
      g.addColorStop(0, "rgba(255,255,255,0.35)");
      g.addColorStop(1, "rgba(0,0,0,0.07)");
      ctx.fillStyle = g;
      ctx.fillRect(x,y,tile,tile);
      ctx.strokeRect(x,y,tile,tile);
    }
  }
  ctx.restore();

  // lignes de fuite : les quatre coins de l'écran convergent vers le point
  // de fuite — c'est ça qui vend vraiment l'impression d'être dans un volume.
  ctx.strokeStyle = "rgba(0,0,0,0.15)"; ctx.lineWidth = 1.5;
  [[0,0],[W,0],[0,floorY],[W,floorY]].forEach(([x,y])=>{
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(vpX,vpY); ctx.stroke();
  });

  // sol en perspective : trapèze clair + grille qui se resserre vers le fond
  ctx.fillStyle = "#b9b3a2";
  ctx.beginPath();
  ctx.moveTo(0,H); ctx.lineTo(W,H); ctx.lineTo(W,floorY); ctx.lineTo(0,floorY);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.16)"; ctx.lineWidth = 1.2;
  const floorLines = 7;
  for(let i=0;i<=floorLines;i++){
    const fx = (i/floorLines)*W;
    ctx.beginPath(); ctx.moveTo(fx, H); ctx.lineTo(vpX, vpY); ctx.stroke();
  }
  for(let i=1;i<=4;i++){
    const t = i/5;
    const y = H + (floorY-H)*t*t; // resserrement progressif vers le fond
    const leftX = (vpX-0)*t*0.55;
    const rightX = W + (vpX-W)*t*0.55;
    ctx.beginPath(); ctx.moveTo(leftX,y); ctx.lineTo(rightX,y); ctx.stroke();
  }

  // le lit, la porte sans poignée et la caméra — ancrés dans la pièce,
  // hors champ tant qu'on ne regarde pas de ce côté.
  drawBed(BED_X*W + shiftPx, floorY, vpX);
  drawDoor(DOOR_X*W + shiftPx, floorY, vpX);
  drawCeilingCamera(CAM_X*W + shiftPx, H*0.15, vpX);

  if(!save.reduceEffects){
    const grainCount = Math.floor(20 + unease*90);
    ctx.fillStyle = "rgba(0,0,0,0.035)";
    for(let i=0;i<grainCount;i++){
      ctx.fillRect(Math.random()*W, Math.random()*H, 1, 1);
    }
  }

  // flicker occasionnel de la lumière
  if(lightFlickerUntil > now()){
    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(0,0,W,H);
  }

  // aperçu furtif, très bref et discret — jamais un jumpscare
  if(now() < glimpseUntil){
    drawFace(glimpseX*W, glimpseY*H, Math.min(W,H)*0.09, 0.45, 6, "#020202");
  }

  // vignette qui s'assombrit avec le malaise
  const cx=W/2, cy=H*0.42;
  const vgn = ctx.createRadialGradient(cx,cy,Math.min(W,H)*0.2,cx,cy,Math.max(W,H)*0.75);
  vgn.addColorStop(0,"rgba(0,0,0,0)");
  vgn.addColorStop(1,`rgba(0,0,0,${0.28+unease*0.45})`);
  ctx.fillStyle = vgn; ctx.fillRect(0,0,W,H);

  // pulse rouge — réaction à une réponse "inattendue", pas un jumpscare
  if(now() < redPulseUntil){
    const alpha = Math.max(0,(redPulseUntil-now())/redPulseDuration) * redPulsePeak;
    ctx.fillStyle = `rgba(170,10,10,${alpha})`;
    ctx.fillRect(0,0,W,H);
  }
}
let lightFlickerUntil = 0;
function triggerLightFlicker(){
  lightFlickerUntil = now() + randRange(90,180);
  setTimeout(()=>{ if(Math.random()<0.5){ lightFlickerUntil = now()+randRange(70,140); } }, 220);
}

function drawScene(){
  drawRoom();
}
function loop(){
  requestAnimationFrame(loop);
  drawScene();
}

/* ============================================================
   Permissions — caméra, micro, position, mouvement, notifications
   Tout ou rien, 100% local, jamais transmis ni stocké au-delà
   de la session en cours.
   ============================================================ */
let camStream = null;
let micStream = null;
let userCoords = null;
let micAnalyser = null, micDataArray = null;
let everGrantedAll = false;

function setupMicFromStream(stream){
  const audioTracks = stream.getAudioTracks ? stream.getAudioTracks() : [];
  if(!audioTracks.length){ micAnalyser = null; return; }
  ensureAudio();
  if(!actx){ micAnalyser = null; return; }
  try{
    const micSource = actx.createMediaStreamSource(stream);
    micAnalyser = actx.createAnalyser();
    micAnalyser.fftSize = 512;
    micDataArray = new Uint8Array(micAnalyser.fftSize);
    micSource.connect(micAnalyser); // jamais reliée à la sortie
  }catch(e){ micAnalyser = null; }
}
function currentMicRms(){
  if(!micAnalyser) return 0;
  micAnalyser.getByteTimeDomainData(micDataArray);
  let sum = 0;
  for(let i=0;i<micDataArray.length;i++){ const v=(micDataArray[i]-128)/128; sum += v*v; }
  return Math.sqrt(sum/micDataArray.length);
}
function stopCamera(){
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream = null; }
  if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream = null; }
  document.getElementById("camWrap").classList.remove("show");
  micAnalyser = null;
}
function sendRealNotification(){
  try{
    if(!("Notification" in window) || Notification.permission !== "granted") return;
    const opts = { body: playerName ? `${playerName}, il sait que tu lis ceci.` : "il sait que tu lis ceci.", silent:false, tag:"letest", renotify:true };
    // sur mobile (Android/Chrome), le constructeur direct échoue silencieusement :
    // il faut passer par le service worker pour une vraie notification système.
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then((reg)=>{
        if(reg && reg.showNotification){ reg.showNotification("…", opts); }
        else { try{ new Notification("…", opts); }catch(e){} }
      }).catch(()=>{ try{ new Notification("…", opts); }catch(e){} });
    } else {
      new Notification("…", opts);
    }
  }catch(e){}
}
async function acquireCameraAndMic(){
  const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}, audio:true});
  camStream = stream;
  micStream = stream;
  const v = document.getElementById("camVideo");
  v.srcObject = stream;
  try{ await v.play(); }catch(e){}
  document.getElementById("camWrap").classList.add("show");
  setupMicFromStream(stream);
  return stream;
}

const PERMS = [
  { key:"camera" },
  { key:"mic" },
  { key:"geo" },
  { key:"motion" },
  { key:"notif" },
];
let permStatus = {};

function setPermBtnState(key, state){
  const btn = document.querySelector('.permBtn[data-key="'+key+'"]');
  if(!btn) return;
  btn.classList.remove("granted","denied","pending");
  if(state===true) btn.classList.add("granted");
  else if(state===false) btn.classList.add("denied");
}
function updateLaunchBtn(){
  const allOk = PERMS.every(p=>permStatus[p.key]===true);
  document.getElementById("launchBtn").classList.toggle("ready", allOk);
  return allOk;
}

async function requestCameraPerm(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user" } });
    camStream = stream;
    const v = document.getElementById("camVideo");
    v.srcObject = stream;
    try{ await v.play(); }catch(e){}
    document.getElementById("camWrap").classList.add("show");
    permStatus.camera = true;
  }catch(e){ permStatus.camera = false; }
  setPermBtnState("camera", permStatus.camera);
  updateLaunchBtn();
}
async function requestMicPerm(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    micStream = stream;
    setupMicFromStream(stream);
    permStatus.mic = true;
  }catch(e){ permStatus.mic = false; }
  setPermBtnState("mic", permStatus.mic);
  updateLaunchBtn();

async function requestGeoPerm(){
  if(!navigator.geolocation){ permStatus.geo = false; setPermBtnState("geo", false); updateLaunchBtn(); return; }
  try{
    const pos = await new Promise((resolve,reject)=>{
      navigator.geolocation.getCurrentPosition(resolve, reject, {timeout:8000});
    });
    userCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
    permStatus.geo = true;
  }catch(e){ permStatus.geo = false; }
  setPermBtnState("geo", permStatus.geo);
  updateLaunchBtn();
}
async function requestMotionPerm(){
  if(typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function"){
    try{
      const res = await DeviceMotionEvent.requestPermission();
      permStatus.motion = (res === "granted");
    }catch(e){ permStatus.motion = false; }
  } else {
    permStatus.motion = true; // pas de prompt sur cette plateforme : non bloquant
  }
  setPermBtnState("motion", permStatus.motion);
  updateLaunchBtn();
}
async function requestNotifPerm(){
  if("Notification" in window){
    try{
      const perm = await Notification.requestPermission();
      permStatus.notif = (perm === "granted");
    }catch(e){ permStatus.notif = false; }
  } else {
    // pas d'API notification sur cette plateforme (ex : Safari iOS hors écran d'accueil) :
    // impossible de montrer une vraie demande, donc jamais de faux "vert".
    permStatus.notif = false;
  }
  setPermBtnState("notif", permStatus.notif);
  updateLaunchBtn();
}
let knownContactName = null;

// bonus rare : disponible seulement sur certains navigateurs Android — un rond de plus

}
function hidePermGate(){ document.getElementById("permGate").classList.remove("show"); }

document.querySelectorAll(".permBtn").forEach(btn=>{
  btn.addEventListener("click", (e)=>{
    e.stopPropagation();
    ensureAudio();
    if(actx && actx.state==="suspended") actx.resume();
    const key = btn.dataset.key;
    if(permStatus[key]===true) return;
    btn.classList.add("pending");
    PERM_HANDLERS[key]().finally(()=>btn.classList.remove("pending"));
  });
  btn.addEventListener("pointerdown",(e)=>e.stopPropagation());
});
document.getElementById("launchBtn").addEventListener("click", (e)=>{
  e.stopPropagation();
  if(!updateLaunchBtn()) return;
  everGrantedAll = true;
  hidePermGate();
  startBoot();
});
document.getElementById("permGateBack").addEventListener("click", (e)=>{ e.stopPropagation(); hidePermGate(); });
document.getElementById("permGate").addEventListener("pointerdown", (e)=>{ e.stopPropagation(); });

document.addEventListener("visibilitychange", ()=>{

    if(state===STATE.PLAYING) stopCamera();

/* ============================================================
   Fils SVG reliant les boutons au téléviseur
   ============================================================ */
function layoutWires(){
  const tv = document.getElementById("tvBody").getBoundingClientRect();
  const yesBtn = document.getElementById("btnYes").getBoundingClientRect();
  const noBtn = document.getElementById("btnNo").getBoundingClientRect();
  const svg = document.getElementById("wires");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const tvx = tv.left+tv.width*0.5, tvy = tv.bottom-6;
  const set = (id, bx, by)=>{
    const path = document.getElementById(id);
    const midY = (tvy+by)/2;
    path.setAttribute("d", `M ${tvx} ${tvy} C ${tvx} ${midY}, ${bx} ${midY}, ${bx} ${by}`);
  };
  set("wireL", yesBtn.left+yesBtn.width/2, yesBtn.top+4);
  set("wireR", noBtn.left+noBtn.width/2, noBtn.top+4);
}

function timeString(){
  const d = new Date();
  return String(d.getHours()).padStart(2,"0")+"h"+String(d.getMinutes()).padStart(2,"0");
}
let batteryLevel = null;

    batteryLevel = Math.round(b.level*100);
    b.addEventListener("levelchange", ()=>{ batteryLevel = Math.round(b.level*100); });
  }).catch(()=>{});
}

let qIndex = -1;
let disturbCount = 0;
let waitingAnswer = false;

/* ============================================================
   Machine du test
   ============================================================ */
function setTvText(text, corrupt){
  const el = document.getElementById("tvText");
  el.textContent = text;
  el.classList.toggle("corrupt", !!corrupt);
}
function setButtonsEnabled(on){
  document.getElementById("btnYes").classList.toggle("disabled", !on);
  document.getElementById("btnNo").classList.toggle("disabled", !on);
}

function nextQuestion(){
  qIndex++;
  while(qIndex < QUESTIONS.length && QUESTIONS[qIndex].skipIf && QUESTIONS[qIndex].skipIf()){
    qIndex++;
  }
  if(qIndex >= QUESTIONS.length){ concludeTest(); return; }
  const q = QUESTIONS[qIndex];
  const txt = typeof q.text === "function" ? q.text() : q.text;

  waitingAnswer = false;
  setButtonsEnabled(false);
  setTvText("…", false);
  unease = Math.min(1, qIndex / (QUESTIONS.length-1));
  setUnease(unease);

  const delay = q.freeze || randRange(500,900);
  setTimeout(()=>{
    if(state!==STATE.PLAYING) return;
    setTvText(txt, !!q.corrupt);
    if(q.effect) q.effect();
    if(q.silenceCheck){
      waitingAnswer = false;
      setButtonsEnabled(false);
      runSilenceCheck(q.silenceCheck);
      return;
    }
    if(q.nameInput){
      waitingAnswer = false;
      setButtonsEnabled(false);
      document.getElementById("buttonRow").classList.add("hide");
      const field = document.getElementById("nameField");
      field.value = "";
      document.getElementById("nameRow").classList.add("show");
      setTimeout(()=>field.focus(), 60);
      return;
    }
    waitingAnswer = !q.corrupt;
    setButtonsEnabled(!q.corrupt);
    if(q.corrupt){
      setTimeout(()=>{ if(state===STATE.PLAYING) nextQuestion(); }, q.freeze || 1500);
    }
  }, delay);
}

function nameSubmit(){
  if(state!==STATE.PLAYING) return;
  const field = document.getElementById("nameField");
  const val = field.value.trim();
  playerName = val.length ? val.slice(0,40) : null;
  save.playerName = playerName;
  writeSave(save);
  document.getElementById("nameRow").classList.remove("show");
  field.blur();
  document.getElementById("buttonRow").classList.remove("hide");
  setTimeout(()=>{ if(state===STATE.PLAYING) nextQuestion(); }, randRange(400,650));
}
document.getElementById("nameConfirm").addEventListener("click", (e)=>{ e.stopPropagation(); nameSubmit(); });
document.getElementById("nameConfirm").addEventListener("pointerdown", (e)=>e.stopPropagation());
document.getElementById("nameField").addEventListener("pointerdown", (e)=>e.stopPropagation());
document.getElementById("nameField").addEventListener("keydown", (e)=>{
  if(e.key==="Enter"){ e.preventDefault(); nameSubmit(); }
});

function runSilenceCheck(duration){
  if(!micAnalyser){
    setTimeout(()=>{ if(state===STATE.PLAYING) nextQuestion(); }, Math.min(duration, 1200));
    return;
  }
  const startT = now();
  let baseline = [];
  let flagged = false;
  const iv = setInterval(()=>{
    if(state!==STATE.PLAYING){ clearInterval(iv); return; }
    const rms = currentMicRms();
    const elapsed = now()-startT;
    if(elapsed < 500){ baseline.push(rms); return; }
    if(flagged) return;
    const avg = baseline.length ? baseline.reduce((a,b)=>a+b,0)/baseline.length : 0.02;
    const threshold = Math.max(0.07, avg*2.4+0.03);
    if(rms > threshold){
      flagged = true;
      disturbCount++;
      setTvText(pick(REACTIONS), true);
      triggerDisturb(unease > 0.55 ? 2 : 1);
    }
  }, 120);
  setTimeout(()=>{
    clearInterval(iv);
    if(state!==STATE.PLAYING) return;
    if(!flagged) setTvText("……bien.", false);
    setTimeout(()=>{ if(state===STATE.PLAYING) nextQuestion(); }, flagged ? 900 : 500);
  }, duration);
}

function answer(isYes){
  if(!waitingAnswer || state!==STATE.PLAYING) return;
  waitingAnswer = false;
  setButtonsEnabled(false);
  clickSound(!isYes);
  vibrate([10]);

  const q = QUESTIONS[qIndex];
  answers[qIndex] = isYes;
  if(q.id) answers[q.id] = isYes;

  const expected = typeof q.expected === "function" ? q.expected() : q.expected;
  const unexpected = !!expected && ((expected==="yes") !== isYes);

  if(unexpected){
    disturbCount++;
    setTvText(pick(REACTIONS), true);
    triggerDisturb(unease > 0.55 ? 2 : 1);
    if(q.onUnexpected) q.onUnexpected();
  }

  const delay = unexpected ? 1300 : randRange(350,600);
  if(q.isLast){
    setTimeout(()=>concludeTest(), delay);
    return;
  }
  setTimeout(()=>nextQuestion(), delay);
}
document.getElementById("btnYes").addEventListener("click", (e)=>{ e.stopPropagation(); answer(true); });
document.getElementById("btnNo").addEventListener("click", (e)=>{ e.stopPropagation(); answer(false); });
document.getElementById("btnYes").addEventListener("pointerdown",(e)=>e.stopPropagation());
document.getElementById("btnNo").addEventListener("pointerdown",(e)=>e.stopPropagation());

function concludeTest(){
  if(disturbCount <= 1){ endQuiet(); } else { endDisturbing(); }
}

/* ============================================================
   Fins
   ============================================================ */
const STATE = { TITLE:"title", BOOT:"boot", PLAYING:"playing", END:"end" };
let state = STATE.TITLE;
let sessionStart = 0;

function endQuiet(){
  state = STATE.END;
  save.quietEndings = (save.quietEndings||0)+1;
  save.lastVisit = now();
  writeSave(save);
  setButtonsEnabled(false);
  stopCamera();
  setTvText("TEST TERMINÉ.", false);
  unease = 0.3; setUnease(unease);

  setTimeout(()=>{
    document.getElementById("endTitle").textContent = "MERCI.";
    document.getElementById("endTitle").style.color = "#8fb0c9";
    document.getElementById("endSub").textContent = "on se revoit bientôt. tu ne sauras pas quand.";
    document.getElementById("endScreen").classList.add("show");
  }, 1200);

  setTimeout(()=>{ whisperSound(0.3); }, 3200);

  setTimeout(()=>{
    document.getElementById("endScreen").classList.remove("show");
    backToTitle();
  }, 6000);
}
function endDisturbing(){
  state = STATE.END;
  save.badEndings = (save.badEndings||0)+1;
  save.lastVisit = now();
  writeSave(save);
  setButtonsEnabled(false);
  stopCamera();

  // montée progressive : petites secousses + texte qui se fragmente.
  // pas de visage géant, pas de cri — juste que plus rien ne colle.
  let step = 0;
  const lines = ["……","ça—suffit.","non.","arrête—de—répondre.","tu—n'aurais—pas—dû"];
  const iv = setInterval(()=>{
    step++;
    triggerDisturb(step>=3 ? 2 : 1); // ça empire à mesure que ça avance
    setTvText(lines[Math.min(step-1, lines.length-1)], true);
    if(step>=4){ clearInterval(iv); cutToBlack(); }
  }, 550);
}
function cutToBlack(){
  const wrap = document.getElementById("tvScreenWrap");
  wrap.style.transition = "opacity 0.12s ease";
  wrap.style.opacity = "0";
  if(actx && droneGain && noiseGain){
    const t = actx.currentTime;
    droneGain.gain.setTargetAtTime(0, t, 0.04);
    noiseGain.gain.setTargetAtTime(0, t, 0.04);
  }
  vibrate(save.reduceEffects ? [] : [0,15,10,15]);

  setTimeout(()=>{
    document.getElementById("endTitle").textContent = "……";
    document.getElementById("endTitle").style.color = "#8a1f1f";
    document.getElementById("endSub").textContent = "on va devoir recommencer.";
    document.getElementById("endScreen").classList.add("show");
  }, 1600);

  setTimeout(()=>{
    document.getElementById("endScreen").classList.remove("show");
    wrap.style.opacity = "1";
    backToTitle();
  }, 5000);
}

/* ============================================================
   Titre — mémoire entre sessions
   ============================================================ */
function buildTitleFlavor(){
  const delta = now() - save.lastVisit;
  let msg;
  if(save.totalSessions === 0){
    msg = "assieds-toi. réponds sincèrement. ça ne prendra pas longtemps.";
  } else if(delta < 60000){
    msg = playerName ? `${playerName}. tu es revenu tout de suite. il ne t'a pas vu partir.` : "tu es revenu tout de suite. il ne t'a pas vu partir.";
  } else if(delta < 3600000){
    msg = (playerName ? `${playerName}, tu` : "tu") + " es parti " + fmtDuration(delta) + ". la salle t'a attendu, telle quelle.";
  } else if(delta < 86400000){
    msg = "ça fait " + fmtDuration(delta) + ". les questions ont eu le temps de changer.";
  } else {
    msg = "ça fait " + fmtDuration(delta) + (playerName ? `, ${playerName}` : "") + ". tu ne devrais peut-être pas revenir.";
  }
  document.getElementById("flavorText").textContent = msg;
  const stat = document.getElementById("statText");
  const parts = [];
  if(save.totalSessions>0) parts.push("tests passés : "+save.totalSessions);
  if(save.badEndings>0) parts.push("mauvaises réponses : "+save.badEndings);
  stat.textContent = parts.join("   ·   ");
}

/* ============================================================
   Transitions
   ============================================================ */
function backToTitle(){
  state = STATE.TITLE;
  buildTitleFlavor();
  document.getElementById("veil").classList.remove("hidden");
}
function startBoot(){
  ensureAudio();
  if(actx && actx.state==="suspended") actx.resume();
  state = STATE.BOOT;
  document.getElementById("veil").classList.add("hidden");
  const boot = document.getElementById("boot");
  boot.classList.remove("hidden");
  setTimeout(()=>{
    boot.classList.add("hidden");
    startTest();
  }, 2000);
}
function startTest(){
  save.totalSessions += 1;
  save.lastVisit = now();
  writeSave(save);
  sessionCount = save.totalSessions;

  state = STATE.PLAYING;
  sessionStart = now();
  qIndex = -1;
  disturbCount = 0;
  answers = [];
  unease = 0; setUnease(0);
  entitySeed = Math.random()*1000;
  redPulseUntil = 0; glimpseUntil = 0;
  lightFlickerUntil = 0;
  document.getElementById("app").classList.remove("shake","shakeHard");
  document.getElementById("nameRow").classList.remove("show");
  document.getElementById("buttonRow").classList.remove("hide");
  document.getElementById("heavenOverlay").classList.remove("show","hell");
  camPan = 0; applyCamPan();

  resize();
  requestAnimationFrame(()=>layoutWires());
  nextQuestion();
}

document.getElementById("startBtn").addEventListener("click", async (e)=>{
  e.stopPropagation();
  if(!everGrantedAll){ showPermGate(); return; }
  if(!camStream){
    try{ await acquireCameraAndMic(); }catch(err){ /* dégradation silencieuse si la ré-acquisition échoue */ }
  }
  startBoot();
});
document.getElementById("resetBtn").addEventListener("click", (e)=>{
  e.stopPropagation();
  try{ localStorage.removeItem(SAVE_KEY); }catch(err){}
  save = loadSave();
  buildTitleFlavor();
});
document.getElementById("gear").addEventListener("click", (e)=>{
  e.stopPropagation();
  save.reduceEffects = !save.reduceEffects;
  writeSave(save);
});

/* ============================================================
   Sauvegarde périodique + service worker
   ============================================================ */
setInterval(()=>{
  if(state===STATE.PLAYING){ save.lastVisit = now(); writeSave(save); }
}, 5000);
window.addEventListener("beforeunload", ()=>{ save.lastVisit = now(); writeSave(save); });

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

/* Init */
resize();
applyCamPan();
requestAnimationFrame(()=>layoutWires());
buildTitleFlavor();
requestAnimationFrame(loop);

})();
