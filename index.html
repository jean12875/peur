<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="LE TEST — réponds sincèrement.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LE TEST">
<title>LE TEST</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#050506; overflow:hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    user-select:none; -webkit-user-select:none;
    touch-action:none;
    overscroll-behavior:none;
  }
  #app{ position:fixed; inset:0; width:100vw; height:100dvh; background:#d9d4c6; overflow:hidden; }
  canvas{ position:absolute; inset:0; display:block; }

  /* ---------- téléviseur ---------- */
  #tvUnit{
    position:absolute; left:50%; top:30%; transform:translate(-50%,-50%);
    width:min(88vw, 380px); z-index:5; display:flex; flex-direction:column; align-items:center;
  }
  #tvBody{
    width:100%; background:#e9e6df; border-radius:10px; padding:4.5% 4.5% 8%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 0 0 2px rgba(0,0,0,0.15);
    display:flex; gap:3%;
    position:relative;
  }
  #tvScreenWrap{
    flex:1; background:#000; border-radius:4px; padding:3%;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
  }
  #tvScreen{
    position:relative; width:100%; aspect-ratio:4/3; background:radial-gradient(ellipse at 50% 30%, #2a5fa0 0%, #0d1f38 75%);
    border-radius:2px; overflow:hidden; display:flex; align-items:center; justify-content:center; padding:8%;
    transition: background 0.6s ease;
  }
  /* passage au vert : une partie du test vient d'être réussie */
  #tvScreen.success{
    background:radial-gradient(ellipse at 50% 30%, #3fb86a 0%, #0d3a1f 75%);
  }
  #tvScreen.success #tvText{ text-shadow:0 0 8px rgba(140,255,180,0.5); }
  /* passage au rouge : ligne corrompue / réponse inattendue — fond rouge, grésillement, texte noir */
  #tvScreen.alert{
    background:radial-gradient(ellipse at 50% 35%, #c22323 0%, #4a0808 65%, #150202 100%);
  }
  #tvScreen.alert.extreme{
    background:radial-gradient(ellipse at 50% 35%, #e01818 0%, #3a0505 55%, #0a0101 100%);
  }
  #tvText{
    color:#dce8fb; font-size:clamp(0.78rem, 3.4vw, 1rem); text-align:center; line-height:1.55em;
    letter-spacing:0.02em; font-weight:500; text-shadow:0 0 6px rgba(150,190,255,0.4);
    z-index:2; transition:opacity 0.25s ease;
  }
  #tvText.corrupt{
    color:#0a0403; font-weight:800;
    text-shadow:0 0 2px rgba(0,0,0,0.9), 0 0 16px rgba(255,30,20,0.55);
  }
  .scanlines{
    position:absolute; inset:0; pointer-events:none; z-index:3;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px, transparent 2px, transparent 3px);
    mix-blend-mode:multiply;
  }
  .tvGlow{ position:absolute; inset:0; pointer-events:none; z-index:1; background:radial-gradient(ellipse at 50% 20%, rgba(255,255,255,0.12), transparent 60%); }
  #tvStatic{
    position:absolute; inset:0; pointer-events:none; z-index:4; opacity:0;
    background-size:64px 64px; mix-blend-mode:overlay; transition:opacity .15s ease;
  }
  #tvStatic.show{ opacity:0.85; }
  #tvDials{ width:16%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10%; }
  .dial{ width:70%; aspect-ratio:1; border-radius:50%; background:#cfcbc2; box-shadow:inset 0 0 0 2px rgba(0,0,0,0.25), inset 0 2px 3px rgba(0,0,0,0.3); }
  #antenna{
    position:absolute; top:-22%; left:50%; width:60%; height:26%; transform:translateX(-50%);
    pointer-events:none;
  }
  #antenna svg{ width:100%; height:100%; }
  #tvStand{ width:34%; height:14px; background:#3a352e; margin-top:-4px; border-radius:0 0 4px 4px; transition:background-color 1.4s ease; }
  #tvLegs{ display:flex; gap:60%; width:34%; margin-top:2px; }
  #tvLegs div{ width:6px; height:22px; background:#3a352e; border-radius:0 0 2px 2px; transition:background-color 1.4s ease; }

  /* ---------- pièce plongée dans le noir : tout s'éteint, sauf l'écran ---------- */
  #tvBody{ transition:background-color 1.4s ease; }
  .dial{ transition:background-color 1.4s ease; }
  #antenna svg line{ transition:stroke 1.4s ease; }
  #buttonRow{ transition:filter 1.4s ease; }
  #wallnote{ transition:opacity 1.4s ease; }
  #app.roomDark #tvBody{ background:#0a0908; }
  #app.roomDark .dial{ background:#161514; }
  #app.roomDark #tvStand{ background:#0c0b09; }
  #app.roomDark #tvLegs div{ background:#0c0b09; }
  #app.roomDark #antenna svg line{ stroke:#1c1c1c; }
  #app.roomDark #buttonRow{ filter:brightness(0.32) saturate(0.6); }
  #app.roomDark #wallnote{ opacity:0; }

  /* ---------- fils + boutons ---------- */
  #wires{ position:absolute; inset:0; z-index:3; pointer-events:none; }
  #wires path{ transition:stroke 1.4s ease; }
  #app.roomDark #wireL, #app.roomDark #wireR{ stroke:#050505; }
  #buttonRow{
    position:absolute; left:0; right:0; bottom:8vh; z-index:6;
    display:flex; justify-content:center; gap:18vw;
  }
  .bigbtn{
    width:min(22vw, 92px); height:min(22vw, 92px); border-radius:50%;
    border:none; cursor:pointer; font-family:inherit;
    font-size:clamp(0.8rem,3.4vw,1rem); font-weight:800; letter-spacing:0.05em; color:#fff;
    box-shadow: 0 10px 0 rgba(0,0,0,0.45), 0 12px 16px rgba(0,0,0,0.5);
    transition: transform .08s ease, box-shadow .08s ease, filter .3s ease;
  }
  .bigbtn:active{ transform:translateY(6px); box-shadow:0 4px 0 rgba(0,0,0,0.45), 0 6px 10px rgba(0,0,0,0.4); }
  .bigbtn.disabled{ filter:grayscale(0.7) brightness(0.6); pointer-events:none; }
  #btnYes{ background:radial-gradient(circle at 35% 30%, #4bdc72, #1f9e46); }
  #btnNo{ background:radial-gradient(circle at 35% 30%, #ff6a5e, #c62a1f); }
  #buttonRow.hide{ display:none; }

  /* ---------- formulaire prénom/nom, dans la porte d'entrée ---------- */
  #pgNameRow{ display:flex; gap:0.6em; }
  #pgNameRow input{
    width:118px; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.25);
    color:#e6e6e6; font-family:inherit; font-size:0.85rem; padding:0.7em 0.8em; border-radius:4px;
    text-align:center; letter-spacing:0.02em; user-select:text; -webkit-user-select:text;
  }
  #pgNameRow input:focus{ outline:none; border-color:rgba(255,255,255,0.5); }
  #pgNameRow input::placeholder{ color:#666; }

  /* ---------- faux paradis (blanc, silencieux, sans suite) ---------- */
  #heavenOverlay{
    position:absolute; inset:0; z-index:40; background:#fff; opacity:0; pointer-events:none;
    transition:opacity 2.4s ease, background-color .2s ease;
  }
  #heavenOverlay.show{ opacity:1; }

  /* ---------- noir total (bruits d'opération) ---------- */
  #blackout{
    position:absolute; inset:0; z-index:42; background:#000; opacity:0; pointer-events:none;
    transition:opacity .8s ease;
  }
  #blackout.show{ opacity:1; }

  /* ---------- écrans overlay ---------- */
  #boot{
    position:absolute; inset:0; z-index:80; background:#000; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1em; opacity:1; transition:opacity 1s ease;
  }
  #boot.hidden{ opacity:0; pointer-events:none; }
  #hourglass{ font-size:2.6rem; color:#8fa; animation:flip 1.6s infinite ease-in-out; }
  @keyframes flip{ 0%,40%{ transform:rotate(0);} 50%,90%{ transform:rotate(180deg);} 100%{ transform:rotate(180deg);} }
  #bootLabel{ color:#7a7a7a; font-size:0.75rem; letter-spacing:0.4em; text-transform:uppercase; }

  #veil{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:8vh 6vw; gap:1.1em; color:#dce8fb; letter-spacing:0.04em;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0.14) 0px, rgba(0,0,0,0.14) 1px, transparent 2px, transparent 3px),
      radial-gradient(ellipse at 50% 28%, #3a72b8 0%, #1c3f6e 45%, #0d1f38 80%, #060f1c 100%);
    transition:opacity 1.2s ease; z-index:70;
  }
  #veil.hidden{ opacity:0; pointer-events:none; }
  .levelTag{ font-size:0.72rem; color:#6a6a6a; letter-spacing:0.35em; text-transform:uppercase; margin-bottom:0.6em; }
  .title{ font-size:clamp(2rem, 8vw, 3.4rem); font-weight:200; letter-spacing:0.3em; margin:0; color:#e6e6e6; text-shadow:0 0 18px rgba(255,255,255,0.08); }
  .flavor{ font-size:clamp(0.82rem, 2.5vw, 1rem); font-weight:300; color:#8a8a8a; max-width:32em; line-height:1.6em; min-height:3em; }
  .stat{ font-size:0.76rem; color:#5c5c5c; letter-spacing:0.1em; text-transform:uppercase; }
  .startbtn{
    margin-top:0.6em; padding:0.85em 2.4em; background:transparent; border:1px solid rgba(255,255,255,0.25);
    color:#d8d8d8; font-size:0.85rem; letter-spacing:0.25em; text-transform:uppercase; cursor:pointer; font-family:inherit;
  }
  .startbtn:active{ background:rgba(255,255,255,0.08); }
  .miniline{ position:absolute; bottom:2.2em; left:0; right:0; text-align:center; font-size:0.7rem; color:#4a4a4a; letter-spacing:0.15em; }
  .miniline button{ background:none;border:none;color:#4a4a4a;font-size:0.7rem;letter-spacing:0.15em; text-decoration:underline; cursor:pointer; padding:0.6em; font-family:inherit; }
  .minisep{ opacity:0.35; }

  #endScreen{
    position:absolute; inset:0; z-index:75; display:flex; align-items:center; justify-content:center;
    background:#000; opacity:0; pointer-events:none; transition:opacity 1.1s ease;
    flex-direction:column; gap:0.7em; text-align:center; padding:6vh 6vw;
  }
  #endScreen.show{ opacity:1; pointer-events:auto; }
  #endTitle{ font-size:clamp(1.3rem,6vw,2.2rem); letter-spacing:0.3em; font-weight:200; }
  #endSub{ color:#666; font-size:0.85rem; letter-spacing:0.08em; max-width:30em; line-height:1.75em; }

  #wallnote{
    position:absolute; left:4vw; bottom:16vh; z-index:2; color:rgba(0,0,0,0.16);
    font-size:0.7rem; max-width:9em; line-height:1.4em; transform:rotate(-2deg);
  }

  #gear{
    position:absolute; top:1em; left:1em; z-index:60; width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:#999;
    display:flex; align-items:center; justify-content:center; font-size:0.9rem; cursor:pointer;
    transition:border-color .3s ease, color .3s ease, background-color .3s ease;
  }
  #gear.active{ border-color:#6a9fdc; color:#6a9fdc; background:rgba(106,159,220,0.12); }

  /* ---------- porte d'entrée : formulaire + notifications ---------- */
  #permGate{
    position:absolute; inset:0; z-index:85; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.97);
  }
  #permGate.show{ display:flex; }
  #permGate .box{ display:flex; flex-direction:column; gap:1.8em; align-items:center; }
  #permGroup{ display:flex; flex-direction:column; align-items:center; gap:0.6em; }
  #permHint{ font-size:0.62rem; color:#4a4a4a; letter-spacing:0.18em; text-transform:uppercase; }
  #permGrid{ display:flex; flex-wrap:wrap; justify-content:center; gap:1em; max-width:14em; }
  .permBtn{
    width:52px; height:52px; border-radius:50%; border:1px solid rgba(255,255,255,0.22);
    background:transparent; color:#555; font-size:1.15rem; cursor:pointer; font-family:inherit;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .35s ease, color .35s ease, background-color .35s ease;
  }
  .permBtn.pending{ opacity:0.45; }
  .permBtn.granted{ border-color:#4bdc72; color:#4bdc72; background:rgba(75,220,114,0.08); }
  .permBtn.denied{ border-color:#8a3a33; color:#8a3a33; }
  #launchBtn{
    width:78px; height:78px; border-radius:50%; border:1px solid rgba(255,255,255,0.16);
    background:transparent; color:#3a3a3a; font-size:1.4rem; cursor:default; font-family:inherit;
    transition:border-color .4s ease, color .4s ease, background-color .4s ease;
  }
  #launchBtn.ready{ border-color:#4bdc72; color:#4bdc72; background:rgba(75,220,114,0.1); cursor:pointer; }
  #permGateBack{
    position:absolute; top:1.4em; left:1.4em; width:30px; height:30px; border-radius:50%;
    border:none; background:none; color:#3a3a3a; font-size:0.95rem; cursor:pointer;
  }

  @keyframes shake{
    0%{ transform:translate(0,0); }
    20%{ transform:translate(-7px,3px); }
    40%{ transform:translate(6px,-5px); }
    60%{ transform:translate(-5px,-3px); }
    80%{ transform:translate(6px,2px); }
    100%{ transform:translate(0,0); }
  }
  #app.shake{ animation:shake 0.4s linear; }

  @keyframes shakeHard{
    0%{ transform:translate(0,0) rotate(0); }
    15%{ transform:translate(-14px,8px) rotate(-1.2deg); }
    30%{ transform:translate(13px,-10px) rotate(1.1deg); }
    45%{ transform:translate(-12px,-7px) rotate(-0.8deg); }
    60%{ transform:translate(12px,6px) rotate(1deg); }
    75%{ transform:translate(-9px,9px) rotate(-0.6deg); }
    90%{ transform:translate(6px,-4px); }
    100%{ transform:translate(0,0) rotate(0); }
  }
  #app.shakeHard{ animation:shakeHard 0.65s linear; }

  /* ---------- corruption du signal : flash RVB désaligné, rare et brutal ---------- */
  #app.corruptFlash{ filter:invert(1) hue-rotate(140deg) saturate(4) contrast(1.4); }

  /* ---------- deux mots dans le noir, juste avant le titre ---------- */
  #wakeText{
    position:absolute; inset:0; z-index:44; display:flex; align-items:center; justify-content:center;
    color:#c9c9c9; font-size:clamp(1.4rem,6vw,2.4rem); letter-spacing:0.5em; text-transform:uppercase;
    font-weight:200; opacity:0; pointer-events:none; text-shadow:0 0 22px rgba(255,255,255,0.15);
    transition:opacity .4s ease;
  }
  #wakeText.show{ opacity:1; }

  /* ---------- bref glitch de balayage (statique + texte qui roule), ~1s ---------- */
  @keyframes tvRollJitter{
    0%{ transform:translateY(0); }
    10%{ transform:translateY(-4%); }
    22%{ transform:translateY(3%); }
    35%{ transform:translateY(-6%); }
    48%{ transform:translateY(2%); }
    60%{ transform:translateY(-3%); }
    75%{ transform:translateY(5%); }
    88%{ transform:translateY(-2%); }
    100%{ transform:translateY(0); }
  }
  #tvText.rollGlitch{
    animation: tvRollJitter 0.22s steps(1,end) infinite;
    text-shadow: 2px 0 rgba(255,60,60,0.8), -2px 0 rgba(60,220,255,0.8);
    letter-spacing:0.07em;
  }

  @media (prefers-reduced-motion: reduce){ #hourglass{ animation:none; } #app.shake{ animation:none; } #app.shakeHard{ animation:none; } #app.corruptFlash{ filter:none; } #tvText.rollGlitch{ animation:none; text-shadow:none; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="wallnote">quelqu'un a gratté ça dans le mur avant toi. tu ne comprends pas la langue.</div>

  <svg id="wires" viewBox="0 0 100 100" preserveAspectRatio="none">
    <path id="wireL" d="" stroke="#111" stroke-width="0.5" fill="none"/>
    <path id="wireR" d="" stroke="#111" stroke-width="0.5" fill="none"/>
  </svg>

  <div id="tvUnit">
    <div id="antenna"><svg viewBox="0 0 100 100"><line x1="30" y1="100" x2="15" y2="0" stroke="#888" stroke-width="1.5"/><line x1="70" y1="100" x2="88" y2="4" stroke="#888" stroke-width="1.5"/></svg></div>
    <div id="tvBody">
      <div id="tvScreenWrap">
        <div id="tvScreen">
          <div id="tvText"></div>
          <div class="tvGlow"></div>
          <div class="scanlines"></div>
          <div id="tvStatic"></div>
        </div>
      </div>
      <div id="tvDials"><div class="dial"></div><div class="dial"></div></div>
    </div>
    <div id="tvStand"></div>
    <div id="tvLegs"><div></div><div></div></div>
  </div>

  <div id="buttonRow">
    <button class="bigbtn" id="btnYes">OUI</button>
    <button class="bigbtn" id="btnNo">NON</button>
  </div>

  <div id="heavenOverlay"></div>
  <div id="blackout"></div>
  <div id="wakeText">réveille-toi.</div>

  <div id="boot" class="hidden">
    <div id="hourglass">⧗</div>
    <div id="bootLabel">chargement</div>
  </div>

  <div id="veil">
    <div class="levelTag">niveau 1</div>
    <div class="title" id="titleText">LE TEST</div>
    <div class="flavor" id="flavorText">assieds-toi. ce protocole existe depuis longtemps. réponds sincèrement, ça ne prendra pas longtemps.</div>
    <div class="stat" id="statText"></div>
    <button class="startbtn" id="startBtn">commencer</button>
    <div class="miniline"><button id="resetBtn">tout oublier</button> <span class="minisep">·</span> <button id="refreshBtn">actualiser</button></div>
  </div>

  <div id="endScreen">
    <div id="endTitle">FIN</div>
    <div id="endSub"></div>
  </div>

  <div id="permGate">
    <button id="permGateBack">←</button>
    <div class="box">
      <div id="pgNameRow">
        <input id="pgFirstName" type="text" placeholder="prénom" maxlength="24" autocomplete="off" autocapitalize="words" spellcheck="false">
        <input id="pgLastName" type="text" placeholder="nom" maxlength="24" autocomplete="off" autocapitalize="words" spellcheck="false">
      </div>
      <div id="permGroup">
        <div id="permGrid">
          <button class="permBtn" data-key="notif"></button>
        </div>
        <div id="permHint">notifications</div>
      </div>
      <button id="launchBtn"></button>
    </div>
  </div>

  <div id="gear" title="paramètres">☾</div>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   Utilitaires & état persistant
   ============================================================ */
const SAVE_KEY = "letest_save_v1";
const now = () => Date.now();
const REDUCE_MOTION = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function randRange(a,b){ return a + Math.random()*(b-a); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    firstVisit: now(), lastVisit: now(), totalSessions: 0,
    quietEndings: 0, badEndings: 0, reduceEffects: REDUCE_MOTION, playerName: null
  };
}
function writeSave(s){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(s)); }catch(e){} }
let save = loadSave();
let playerName = save.playerName || null;

function fmtDuration(ms){
  const s = Math.floor(ms/1000);
  if(s < 60) return s + " seconde" + (s===1?"":"s");
  const m = Math.floor(s/60);
  if(m < 60) return m + " minute" + (m===1?"":"s");
  const h = Math.floor(m/60);
  if(h < 24) return h + " heure" + (h===1?"":"s");
  const d = Math.floor(h/24);
  return d + " jour" + (d===1?"":"s");
}

/* ============================================================
   Canvas — ambiance de la pièce
   ============================================================ */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W*DPR); canvas.height = Math.floor(H*DPR);
  canvas.style.width = W+"px"; canvas.style.height = H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layoutWires();
}
window.addEventListener("resize", resize);

/* ============================================================
   Audio (100% procédural)
   ============================================================ */
let actx=null, droneGain=null, noiseGain=null, masterGain=null, noiseSrc=null, lfo=null, lfoGain=null, filter=null, compressor=null;
function ensureAudio(){
  if(actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  actx = new AC();
  // un compresseur en sortie pour pouvoir pousser le volume sans que ça sature
  // quand plusieurs sons se superposent (frappe du texte + ambiance + réaction).
  compressor = actx.createDynamicsCompressor();
  compressor.threshold.value = -18;
  compressor.knee.value = 24;
  compressor.ratio.value = 8;
  compressor.attack.value = 0.003;
  compressor.release.value = 0.25;
  compressor.connect(actx.destination);

  masterGain = actx.createGain(); masterGain.gain.value = 1.15;
  masterGain.connect(compressor);

  const osc = actx.createOscillator();
  osc.type = "sine"; osc.frequency.value = 52;
  droneGain = actx.createGain(); droneGain.gain.value = 0.05;
  osc.connect(droneGain); droneGain.connect(masterGain);
  osc.start();

  lfo = actx.createOscillator(); lfo.frequency.value = 0.15;
  lfoGain = actx.createGain(); lfoGain.gain.value = 0.025;

/* ============================================================
   Visage procédural — réservé à de très brefs aperçus furtifs,
   jamais à un jumpscare plein écran
   ============================================================ */
let entitySeed = Math.random()*1000;
function drawFace(x,y,size,alpha,jitter,fillStyle){
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
  ctx.translate(x,y);
  ctx.fillStyle = fillStyle || "#050505";
  ctx.beginPath();
  const pts = 16;
  for(let i=0;i<=pts;i++){
    const a = (i/pts) * Math.PI*2;
    const jr = size*(0.5+0.5*Math.sin(a*2.7+entitySeed)) + (Math.random()-0.5)*jitter;
    const px = Math.cos(a)*jr*0.62;
    const py = Math.sin(a)*jr;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = "#f3f3f3";
  const eyeY = -size*0.08, eyeDX = size*0.22;
  const eyeW = size*0.09*(0.7+Math.random()*0.6), eyeH = size*0.15*(0.6+Math.random()*0.8);
  ctx.beginPath(); ctx.ellipse(-eyeDX,eyeY,eyeW,eyeH,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(eyeDX,eyeY,eyeW*0.8,eyeH*0.9,0,0,Math.PI*2); ctx.fill();

  ctx.fillStyle = "#000";
  ctx.beginPath();
  const mw = size*0.32, my = size*0.28;
  ctx.moveTo(-mw,my);
  for(let i=0;i<=8;i++){
    const px = -mw + (mw*2*i/8);
    const py = my + Math.sin(i*1.7+entitySeed)*size*0.05 + (Math.random()-0.5)*jitter*0.6;
    ctx.lineTo(px,py);
  }
  ctx.lineTo(mw,my+size*0.14); ctx.lineTo(-mw,my+size*0.14);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function sawSound(t0, dur){
  if(!actx) return;
  const o = actx.createOscillator(); o.type = "sawtooth";
  o.frequency.setValueAtTime(68, t0);
  const trem = actx.createOscillator(); trem.frequency.value = 11;
  const tremGain = actx.createGain(); tremGain.gain.value = 16;
  trem.connect(tremGain); tremGain.connect(o.frequency);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.19, t0+0.35);
  g.gain.setValueAtTime(0.19, t0+Math.max(0.4,dur-0.5));
  g.gain.linearRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(masterGain);
  o.start(t0); trem.start(t0); o.stop(t0+dur); trem.stop(t0+dur);
}
function metalClinkSound(t0){
  if(!actx) return;
  const o = actx.createOscillator(); o.type = "square";
  o.frequency.setValueAtTime(1500+Math.random()*1100, t0);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.1, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+0.12);
  o.connect(g); g.connect(masterGain);
  o.start(t0); o.stop(t0+0.13);
}
function heartbeepSound(t0, flatline){
  if(!actx) return;
  const o = actx.createOscillator(); o.type = "sine";
  const g = actx.createGain();
  if(flatline){
    o.frequency.setValueAtTime(840, t0);
    g.gain.setValueAtTime(0.075, t0);
    g.gain.setValueAtTime(0.075, t0+1.8);
    g.gain.linearRampToValueAtTime(0.0001, t0+2.0);
    o.connect(g); g.connect(masterGain);
    o.start(t0); o.stop(t0+2.0);
    return;
  }
  o.frequency.setValueAtTime(740, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.095, t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+0.18);
  o.connect(g); g.connect(masterGain);
  o.start(t0); o.stop(t0+0.2);
}
function operationSound(duration){
  if(!actx) return;
  const t0 = actx.currentTime;
  sawSound(t0+0.4, Math.min(3.4, duration*0.4));
  let ct = t0+0.3;
  while(ct < t0+duration-0.3){
    if(Math.random()<0.55) metalClinkSound(ct);
    ct += randRange(0.4,1.1);
  }
  let bt = t0+0.15;
  const flatAt = t0+duration*0.76;
  while(bt < t0+duration){
    heartbeepSound(bt, bt>=flatAt);
    if(bt>=flatAt) break;
    bt += 0.74;
  }
}

/* ============================================================
   Rendu de fond (salle d'isolement blanche capitonnée + grain + vignette)
   ============================================================ */
let unease = 0; // 0..1, monte avec la progression du test
function drawRoom(){
  ctx.fillStyle = "#d9d4c6"; ctx.fillRect(0,0,W,H);

  // dalles capitonnées
  const tile = Math.max(46, Math.min(W,H)/9);
  ctx.strokeStyle = "rgba(0,0,0,0.14)"; ctx.lineWidth = 2;
  for(let y=-tile; y<H+tile; y+=tile){
    for(let x=-tile; x<W+tile; x+=tile){
      const g = ctx.createRadialGradient(x+tile/2,y+tile/2,tile*0.05,x+tile/2,y+tile/2,tile*0.62);
      g.addColorStop(0, "rgba(255,255,255,0.4)");
      g.addColorStop(1, "rgba(0,0,0,0.08)");
      ctx.fillStyle = g;
      ctx.fillRect(x,y,tile,tile);
      ctx.strokeRect(x,y,tile,tile);
    }
  }

  // sol
  const floorY = H*0.78;
  ctx.fillStyle = "#b9b3a2";
  ctx.fillRect(0,floorY,W,H-floorY);
  ctx.strokeStyle = "rgba(0,0,0,0.18)"; ctx.lineWidth=1.5;
  const ftile = tile*0.8;
  for(let x=-ftile; x<W+ftile; x+=ftile){
    ctx.beginPath(); ctx.moveTo(x,floorY); ctx.lineTo(x,H); ctx.stroke();
  }

  if(!save.reduceEffects){
    const grainCount = Math.floor(20 + unease*90);
    ctx.fillStyle = "rgba(0,0,0,0.035)";
    for(let i=0;i<grainCount;i++){
      ctx.fillRect(Math.random()*W, Math.random()*H, 1, 1);
    }
  }

  // flicker occasionnel de la lumière
  if(lightFlickerUntil > now()){
    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(0,0,W,H);
  }

  // aperçu furtif, très bref et discret — jamais un jumpscare
  if(now() < glimpseUntil){
    drawFace(glimpseX*W, glimpseY*H, Math.min(W,H)*0.09, 0.45, 6, "#020202");
  }

  // l'unique monstre du jeu — grand, net, au visage, quelques centaines de ms
  if(now() < monsterUntil){
    drawFace(monsterX*W, monsterY*H, Math.min(W,H)*0.24, 0.9 + Math.random()*0.1, 16, "#080000");
  }

  // vignette qui s'assombrit avec le malaise
  const cx=W/2, cy=H*0.42;
  const vgn = ctx.createRadialGradient(cx,cy,Math.min(W,H)*0.2,cx,cy,Math.max(W,H)*0.75);
  vgn.addColorStop(0,"rgba(0,0,0,0)");
  vgn.addColorStop(1,`rgba(0,0,0,${0.28+unease*0.45})`);
  ctx.fillStyle = vgn; ctx.fillRect(0,0,W,H);

  // pulse rouge — réaction à une réponse "inattendue", pas un jumpscare
  if(now() < redPulseUntil){
    const alpha = Math.max(0,(redPulseUntil-now())/redPulseDuration) * redPulsePeak;
    ctx.fillStyle = `rgba(170,10,10,${alpha})`;
    ctx.fillRect(0,0,W,H);
  }

  // pièce plongée dans le noir — seul le téléviseur (hors canvas) reste visible
  const targetDark = roomDark ? 0.95 : 0;
  roomDarkAlpha += (targetDark - roomDarkAlpha) * 0.06;
  if(roomDarkAlpha > 0.01){
    ctx.fillStyle = `rgba(2,2,3,${roomDarkAlpha})`;
    ctx.fillRect(0,0,W,H);
  }
}
let roomDark = false, roomDarkAlpha = 0;
function setRoomDark(on){
  roomDark = !!on;

let lightFlickerUntil = 0;

/* ============================================================
   Permissions — uniquement les notifications. Le prénom et le nom
   sont saisis dans le même formulaire, avant le lancement du test.
   100% local, jamais transmis ni stocké au-delà de la session.
   ============================================================ */
let everGrantedAll = false;

function sendRealNotification(){
  try{
    if(!("Notification" in window) || Notification.permission !== "granted") return;
    const opts = { body: playerName ? `${playerName}, il sait que tu lis ceci.` : "il sait que tu lis ceci.", silent:false, tag:"letest", renotify:true };
    // sur mobile (Android/Chrome), le constructeur direct échoue silencieusement :
    // il faut passer par le service worker pour une vraie notification système.
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then((reg)=>{
        if(reg && reg.showNotification){ reg.showNotification("…", opts); }
        else { try{ new Notification("…", opts); }catch(e){} }
      }).catch(()=>{ try{ new Notification("…", opts); }catch(e){} });
    } else {
      new Notification("…", opts);
    }
  }catch(e){}
}
const PERMS = [
  { key:"notif" },
];
let permStatus = {};

function setPermBtnState(key, state){
  const btn = document.querySelector('.permBtn[data-key="'+key+'"]');
  if(!btn) return;
  btn.classList.remove("granted","denied","pending");
  if(state===true) btn.classList.add("granted");
  else if(state===false) btn.classList.add("denied");
}
function nameFieldsFilled(){
  const f = document.getElementById("pgFirstName").value.trim();
  const l = document.getElementById("pgLastName").value.trim();
  return f.length>0 && l.length>0;
}
function updateLaunchBtn(){
  const allOk = PERMS.every(p=>permStatus[p.key]===true) && nameFieldsFilled();
  document.getElementById("launchBtn").classList.toggle("ready", allOk);
  return allOk;
}

async function requestNotifPerm(){
  if("Notification" in window){
    try{
      const perm = await Notification.requestPermission();
      permStatus.notif = (perm === "granted");
    }catch(e){ permStatus.notif = false; }
  } else {
    // pas d'API notification sur cette plateforme (ex : Safari iOS hors écran d'accueil) :
    // impossible de montrer une vraie demande, donc jamais de faux "vert".
    permStatus.notif = false;
  }
  setPermBtnState("notif", permStatus.notif);
  updateLaunchBtn();
}
const PERM_HANDLERS = { notif:requestNotifPerm };

function showPermGate(){
  document.getElementById("permGate").classList.add("show");
  PERMS.forEach(p=>setPermBtnState(p.key, permStatus[p.key]));
  const firstField = document.getElementById("pgFirstName");
  const lastField = document.getElementById("pgLastName");
  if(playerName){
    const parts = playerName.split(" ");
    firstField.value = parts[0] || "";
    lastField.value = parts.slice(1).join(" ") || "";

document.querySelectorAll(".permBtn").forEach(btn=>{

let qIndex = -1;
let disturbCount = 0;
let waitingAnswer = false;

/* ============================================================
   Machine du test
   ============================================================ */
/* fond rouge + grésillement, pour remplacer le simple texte rouge d'avant :
   le téléviseur lui-même a l'air de dérailler, pas juste sa police */
let corruptStaticIv = null;
function applyAlertVisual(on, extreme){
  const screen = document.getElementById("tvScreen");
  const staticEl = document.getElementById("tvStatic");
  screen.classList.toggle("alert", !!on);
  screen.classList.toggle("extreme", !!on && !!extreme);
  if(on){
    buildTvStaticTexture();
    staticEl.classList.add("show");
    if(!corruptStaticIv){
      corruptStaticIv = setInterval(()=>{
        staticEl.style.backgroundPosition = `${(Math.random()*48).toFixed(0)}px ${(Math.random()*48).toFixed(0)}px`;
      }, extreme ? 55 : 90);
    }
  } else {
    if(corruptStaticIv){ clearInterval(corruptStaticIv); corruptStaticIv = null; }
    if(!staticEffectBusy) staticEl.classList.remove("show");
  }
}
function setTvText(text, corrupt){
  const el = document.getElementById("tvText");
  el.textContent = text;
  el.classList.toggle("corrupt", !!corrupt);
  applyAlertVisual(!!corrupt, false);
}
function setButtonsEnabled(on){
  document.getElementById("btnYes").classList.toggle("disabled", !on);
  document.getElementById("btnNo").classList.toggle("disabled", !on);
}

/* écrit le texte lettre par lettre, comme sur un vieux téléscripteur —
   annulable si une nouvelle question démarre avant la fin */
let typingActive = false;
let typingTimeoutIds = [];
function clearTypingTimeouts(){
  typingTimeoutIds.forEach(id=>clearTimeout(id));
  typingTimeoutIds = [];
}
function typeTvText(text, corrupt, onDone, extreme){
  const el = document.getElementById("tvText");
  el.classList.toggle("corrupt", !!corrupt);
  applyAlertVisual(!!corrupt, !!extreme);
  clearTypingTimeouts();
  typingActive = true;
  const chars = Array.from(text);
  el.textContent = "";
  if(save.reduceEffects || chars.length === 0){
    el.textContent = text;
    typingActive = false;
    if(onDone) onDone();
    return;
  }
  const perChar = corrupt ? 40 : 26;
  let i = 0;
  const step = ()=>{
    if(!typingActive) return;
    i++;
    el.textContent = chars.slice(0,i).join("");
    if(i % 2 === 0) typeTickSound();
    if(i < chars.length){
      const jitter = corrupt ? randRange(-10,45) : randRange(-6,16);
      typingTimeoutIds.push(setTimeout(step, perChar+jitter));
    } else {
      typingActive = false;
      if(onDone) onDone();
    }
  };
  typingTimeoutIds.push(setTimeout(step, perChar));
}

function nextQuestion(){
  qIndex++;
  while(qIndex < QUESTIONS.length && QUESTIONS[qIndex].skipIf && QUESTIONS[qIndex].skipIf()){
    qIndex++;
  }
  if(qIndex >= QUESTIONS.length){ concludeTest(); return; }
  const q = QUESTIONS[qIndex];
  const txt = typeof q.text === "function" ? q.text() : q.text;

  waitingAnswer = false;
  setButtonsEnabled(false);
  setTvText("…", false);
  unease = Math.min(1, qIndex / (QUESTIONS.length-1));
  setUnease(unease);

  const delay = q.freeze || randRange(500,900);
  setTimeout(()=>{
    if(state!==STATE.PLAYING) return;
    if(q.effect) q.effect();
    typeTvText(txt, !!q.corrupt, ()=>{
      if(state!==STATE.PLAYING) return;
      waitingAnswer = !q.corrupt && !q.auto;
      setButtonsEnabled(!q.corrupt && !q.auto);
      if(q.corrupt || q.auto){
        setTimeout(()=>{ if(state===STATE.PLAYING) nextQuestion(); }, q.holdFor || q.freeze || 1500);
      }
    });
  }, delay);
}

function answer(isYes){
  if(!waitingAnswer || state!==STATE.PLAYING) return;
  waitingAnswer = false;
  setButtonsEnabled(false);
  clickSound(!isYes);
  vibrate([10]);

  const q = QUESTIONS[qIndex];
  answers[qIndex] = isYes;
  if(q.id) answers[q.id] = isYes;

  const expected = typeof q.expected === "function" ? q.expected() : q.expected;
  const unexpected = !!expected && ((expected==="yes") !== isYes);

  if(unexpected){
    disturbCount++;
    // certaines réactions, plus tard dans le test, deviennent encore plus étranges —
    // texte corrompu, effets en plus, jamais au tout début
    const extreme = unease > 0.45 && Math.random() < 0.35;
    typeTvText(extreme ? pick(REACTIONS_EXTREME) : pick(REACTIONS), true, undefined, extreme);
    triggerDisturb(extreme ? 2 : (unease > 0.55 ? 2 : 1));
    if(extreme){ glitchBurstSound(); triggerLightFlicker(); }
    if(q.onUnexpected) q.onUnexpected();
  }

  const delay = unexpected ? 1300 : randRange(350,600);
  if(q.isLast){
    setTimeout(()=>concludeTest(), delay);
    return;
  }
  setTimeout(()=>nextQuestion(), delay);
}
document.getElementById("btnYes").addEventListener("click", (e)=>{ e.stopPropagation(); answer(true); });
document.getElementById("btnNo").addEventListener("click", (e)=>{ e.stopPropagation(); answer(false); });
document.getElementById("btnYes").addEventListener("pointerdown",(e)=>e.stopPropagation());
document.getElementById("btnNo").addEventListener("pointerdown",(e)=>e.stopPropagation());

function concludeTest(){
  if(disturbCount <= 1){ endQuiet(); } else { endDisturbing(); }
}

/* ============================================================
   Fins
   ============================================================ */
const STATE = { TITLE:"title", BOOT:"boot", PLAYING:"playing", END:"end" };
let state = STATE.TITLE;
let sessionStart = 0;

function endQuiet(){
  state = STATE.END;
  save.quietEndings = (save.quietEndings||0)+1;
  save.lastVisit = now();
  writeSave(save);
  setButtonsEnabled(false);
  setTvText("TEST TERMINÉ.", false);
  unease = 0.3; setUnease(unease);

  setTimeout(()=>{
    document.getElementById("endTitle").textContent = "MERCI.";
    document.getElementById("endTitle").style.color = "#8fb0c9";
    document.getElementById("endSub").textContent = `durée du test : ${fmtDuration(now()-sessionStart)}. on se revoit bientôt. tu ne sauras pas quand.`;
    document.getElementById("endScreen").classList.add("show");
  }, 1200);

  setTimeout(()=>{ whisperSound(0.3); }, 3200);

  // juste avant de revenir au titre, un noir total avec deux mots — jamais expliqués,
  // jamais répétés, jamais montrés si le joueur relance : le malaise vient de ne pas savoir pourquoi.
  setTimeout(()=>{
    document.getElementById("endScreen").classList.remove("show");
    const bo = document.getElementById("blackout");
    bo.classList.add("show");
    const wakeEl = document.getElementById("wakeText");
    setTimeout(()=>{ if(wakeEl){ wakeEl.classList.add("show"); heartbeepSound(actx?actx.currentTime:0,false); } }, 500);
    setTimeout(()=>{ if(wakeEl) wakeEl.classList.remove("show"); }, 2200);
    setTimeout(()=>{ bo.classList.remove("show"); backToTitle(); }, 3000);
  }, 6000);
}
function endDisturbing(){
  state = STATE.END;
  save.badEndings = (save.badEndings||0)+1;
  save.lastVisit = now();
  writeSave(save);
  setButtonsEnabled(false);

  // montée progressive : petites secousses + texte qui se fragmente.
  // pas de visage géant, pas de cri — juste que plus rien ne colle.
  let step = 0;
  const lines = ["……","ça—suffit.","non.","arrête—de—répondre.","tu—n'aurais—pas—dû"];
  const iv = setInterval(()=>{
    step++;
    triggerDisturb(step>=3 ? 2 : 1); // ça empire à mesure que ça avance
    setTvText(lines[Math.min(step-1, lines.length-1)], true);
    if(step>=4){ clearInterval(iv); cutToBlack(); }
  }, 550);
}
function cutToBlack(){
  const wrap = document.getElementById("tvScreenWrap");
  wrap.style.transition = "opacity 0.12s ease";
  wrap.style.opacity = "0";
  if(actx && droneGain && noiseGain){
    const t = actx.currentTime;
    droneGain.gain.setTargetAtTime(0, t, 0.04);
    noiseGain.gain.setTargetAtTime(0, t, 0.04);
  }
  vibrate(save.reduceEffects ? [] : [0,15,10,15]);

  setTimeout(()=>{
    document.getElementById("endTitle").textContent = "……";
    document.getElementById("endTitle").style.color = "#8a1f1f";
    document.getElementById("endSub").textContent = "on va devoir recommencer.";
    document.getElementById("endScreen").classList.add("show");
  }, 1600);

  setTimeout(()=>{
    document.getElementById("endScreen").classList.remove("show");
    wrap.style.opacity = "1";
    backToTitle();
  }, 5000);
}

/* ============================================================
   Titre — mémoire entre sessions
   ============================================================ */
function buildTitleFlavor(){
  const delta = now() - save.lastVisit;
  let msg;
  if(save.totalSessions === 0){
    msg = "assieds-toi. ce protocole existe depuis longtemps. réponds sincèrement, ça ne prendra pas longtemps.";
  } else if(delta < 60000){
    msg = playerName ? `${playerName}. tu es revenu tout de suite. il ne t'a pas vu partir.` : "tu es revenu tout de suite. il ne t'a pas vu partir.";
  } else if(delta < 3600000){
    msg = (playerName ? `${playerName}, tu` : "tu") + " es parti " + fmtDuration(delta) + ". la salle t'a attendu, telle quelle.";
  } else if(delta < 86400000){
    msg = "ça fait " + fmtDuration(delta) + ". les questions ont eu le temps de changer.";
  } else {
    msg = "ça fait " + fmtDuration(delta) + (playerName ? `, ${playerName}` : "") + ". tu ne devrais peut-être pas revenir.";
  }
  document.getElementById("flavorText").textContent = msg;
  const stat = document.getElementById("statText");
  const parts = [];
  if(save.totalSessions>0) parts.push("tests passés : "+save.totalSessions);
  if(save.quietEndings>0) parts.push("fins calmes : "+save.quietEndings);
  if(save.badEndings>0) parts.push("mauvaises réponses : "+save.badEndings);
  stat.textContent = parts.join("   ·   ");
}

/* ============================================================
   Transitions
   ============================================================ */
function backToTitle(){
  state = STATE.TITLE;
  buildTitleFlavor();
  document.getElementById("veil").classList.remove("hidden");
}
function startBoot(){
  ensureAudio();
  if(actx && actx.state==="suspended") actx.resume();
  state = STATE.BOOT;
  document.getElementById("veil").classList.add("hidden");
  const boot = document.getElementById("boot");
  boot.classList.remove("hidden");
  powerHumSound();
  setTimeout(()=>{
    boot.classList.add("hidden");
    startTest();
  }, 2000);
}
function startTest(){
  save.totalSessions += 1;
  save.lastVisit = now();
  writeSave(save);
  sessionCount = save.totalSessions;

  state = STATE.PLAYING;
  sessionStart = now();
  qIndex = -1;
  disturbCount = 0;
  answers = [];
  unease = 0; setUnease(0);
  entitySeed = Math.random()*1000;
  redPulseUntil = 0; glimpseUntil = 0;
  lightFlickerUntil = 0;
  staticEffectBusy = false;
  overlayActive = false;
  clearTypingTimeouts();
  typingActive = false;
  monsterShown = false;
  monsterUntil = 0;
  roomDark = false;
  roomDarkAlpha = 0;
  if(corruptStaticIv){ clearInterval(corruptStaticIv); corruptStaticIv = null; }
  document.getElementById("tvScreen").classList.remove("alert","extreme");
  document.getElementById("app").classList.remove("roomDark");
  document.getElementById("app").classList.remove("shake","shakeHard");
  document.getElementById("buttonRow").classList.remove("hide");
  document.getElementById("heavenOverlay").classList.remove("show");
  document.getElementById("tvStatic").classList.remove("show");
  document.getElementById("blackout").classList.remove("show");
  document.getElementById("wakeText").classList.remove("show");
  document.getElementById("app").classList.remove("corruptFlash");
  document.getElementById("tvText").classList.remove("rollGlitch");
  document.getElementById("tvScreen").classList.remove("success");

  resize();
  requestAnimationFrame(()=>layoutWires());
  nextQuestion();
}

document.getElementById("startBtn").addEventListener("click", (e)=>{
  e.stopPropagation();
  if(!everGrantedAll || !playerName){ showPermGate(); return; }
  startBoot();
});
document.getElementById("resetBtn").addEventListener("click", (e)=>{
  e.stopPropagation();
  try{ localStorage.removeItem(SAVE_KEY); }catch(err){}
  save = loadSave();
  playerName = null;
  everGrantedAll = false;
  permStatus = {};
  document.getElementById("pgFirstName").value = "";
  document.getElementById("pgLastName").value = "";
  buildTitleFlavor();
  updateGearState();
});
document.getElementById("refreshBtn").addEventListener("click", (e)=>{
  e.stopPropagation();
  const btn = e.currentTarget;
  btn.textContent = "…";
  const done = ()=> location.reload();
  const clearCaches = ()=> ("caches" in window)
    ? caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))).catch(()=>{})
    : Promise.resolve();
  if("serviceWorker" in navigator){
    navigator.serviceWorker.getRegistrations()
      .then(regs=>Promise.all(regs.map(r=>r.unregister())))
      .catch(()=>{})
      .then(clearCaches)
      .then(done)
      .catch(done);
  } else {
    clearCaches().then(done).catch(done);
  }
});
function updateGearState(){
  const gearEl = document.getElementById("gear");
  gearEl.classList.toggle("active", !!save.reduceEffects);
  gearEl.title = save.reduceEffects ? "paramètres — effets réduits (activé)" : "paramètres — effets réduits";
}
document.getElementById("gear").addEventListener("click", (e)=>{
  e.stopPropagation();
  save.reduceEffects = !save.reduceEffects;
  writeSave(save);
  updateGearState();
  vibrate([12]);
});

/* ============================================================
   Sauvegarde périodique + service worker
   ============================================================ */
setInterval(()=>{
  if(state===STATE.PLAYING){ save.lastVisit = now(); writeSave(save); }
}, 5000);
window.addEventListener("beforeunload", ()=>{ save.lastVisit = now(); writeSave(save); });

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

/* Init */
resize();
requestAnimationFrame(()=>layoutWires());
buildTitleFlavor();
updateGearState();
requestAnimationFrame(loop);

})();
</script>
