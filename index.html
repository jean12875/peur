<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="VEILLE — il a besoin de te voir pour commencer.">
<title>VEILLE</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#000; overflow:hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    user-select:none; -webkit-user-select:none;
    touch-action:none;
    overscroll-behavior:none;
  }
  #app{ position:fixed; inset:0; width:100vw; height:100dvh; background:#000; }
  canvas{ position:absolute; inset:0; display:block; }

  #veil{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:8vh 6vw; gap:1.1em;
    color:#cfcfcf; letter-spacing:0.04em;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.92) 75%);
    transition:opacity 1.4s ease;
    z-index:10;
  }
  #veil.hidden{ opacity:0; pointer-events:none; }

  .title{
    font-size:clamp(2.4rem, 9vw, 4.4rem); font-weight:200; letter-spacing:0.35em;
    margin:0 0 0.1em 0; color:#e6e6e6; text-shadow:0 0 18px rgba(255,255,255,0.08);
  }
  .flavor{
    font-size:clamp(0.85rem, 2.6vw, 1.05rem); font-weight:300; color:#8a8a8a;
    max-width:34em; line-height:1.6em; min-height:3.2em;
  }
  .stat{ font-size:0.78rem; color:#5c5c5c; letter-spacing:0.1em; text-transform:uppercase; }
  .startbtn{
    margin-top:0.6em; padding:0.85em 2.4em; background:transparent;
    border:1px solid rgba(255,255,255,0.25); color:#d8d8d8;
    font-size:0.85rem; letter-spacing:0.25em; text-transform:uppercase;
    cursor:pointer; font-family:inherit;
  }
  .startbtn:active{ background:rgba(255,255,255,0.08); }

  .miniline{
    position:absolute; bottom:2.2em; left:0; right:0; text-align:center;
    font-size:0.7rem; color:#4a4a4a; letter-spacing:0.15em;
  }
  .miniline button{
    background:none;border:none;color:#4a4a4a;font-size:0.7rem;letter-spacing:0.15em;
    text-decoration:underline; cursor:pointer; padding:0.6em; font-family:inherit;
  }

  #hint{
    position:absolute; left:0; right:0; bottom:9vh; text-align:center;
    color:rgba(255,255,255,0.35); font-size:0.75rem; letter-spacing:0.3em;
    text-transform:uppercase; pointer-events:none; transition:opacity 2s ease; z-index:5;
  }

  #turnBtn{
    position:absolute; left:50%; bottom:9vh; transform:translateX(-50%);
    padding:0.7em 1.6em; background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.25);
    color:#ddd; font-size:0.72rem; letter-spacing:0.22em; text-transform:uppercase;
    opacity:0; pointer-events:none; transition:opacity 1.4s ease; z-index:12; cursor:pointer;
    font-family:inherit;
  }
  #turnBtn.show{ opacity:0.9; pointer-events:auto; }

  #diedScreen{
    position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:#000; opacity:0; pointer-events:none; transition:opacity 0.6s ease;
    flex-direction:column; gap:0.6em; text-align:center; padding:6vh 6vw;
  }
  #diedScreen.show{ opacity:1; pointer-events:auto; }
  #diedScreen .diedTitle{ color:#8a1f1f; font-size:clamp(1.6rem,7vw,2.6rem); letter-spacing:0.3em; font-weight:200; }
  #diedScreen .diedSub{ color:#666; font-size:0.85rem; letter-spacing:0.1em; max-width:30em; line-height:1.7em; }

  #flashLayer{ position:absolute; inset:0; z-index:30; pointer-events:none; background:#fff; opacity:0; }

  #fakeOS{
    position:absolute; top:0; left:0; right:0; z-index:40; pointer-events:none;
    display:flex; justify-content:space-between; padding:0.6em 1em; font-size:0.72rem;
    color:#eee; opacity:0; letter-spacing:0.05em;
    background:linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  }
  #fakeNotif{
    position:absolute; top:2.4em; left:3vw; right:3vw; z-index:41; pointer-events:none;
    background:rgba(20,20,20,0.92); border:1px solid rgba(255,255,255,0.08);
    border-radius:14px; padding:0.7em 0.9em; color:#eee; font-size:0.78rem;
    opacity:0; transform:translateY(-10px); transition:opacity .25s ease, transform .25s ease;
    display:flex; flex-direction:column; gap:0.15em;
  }
  #fakeNotif b{ font-weight:600; font-size:0.75rem; color:#bbb; }
  #fakeNotif.show{ opacity:1; transform:translateY(0); }

  #recDot{
    position:absolute; top:0.7em; right:1em; width:7px; height:7px; border-radius:50%;
    background:#c0392b; z-index:42; opacity:0; box-shadow:0 0 6px #c0392b;
  }

  #camWrap{
    position:absolute; bottom:1.4em; right:1.4em; width:84px; height:112px; z-index:15;
    border:1px solid rgba(255,255,255,0.15); overflow:hidden; opacity:0; transition:opacity 1s ease;
    background:#000;
  }
  #camWrap.show{ opacity:0.85; }
  #camWrap video{ width:100%; height:100%; object-fit:cover; filter:grayscale(1) contrast(1.6) brightness(0.65); transform:scaleX(-1); }
  #camWrap .camlabel{ position:absolute; bottom:2px; left:4px; font-size:0.55rem; color:#c0392b; letter-spacing:0.1em; }
  #camWrap .eyeDot{
    position:absolute; top:4px; right:4px; width:6px; height:6px; border-radius:50%;
    background:#2ecc71; box-shadow:0 0 5px #2ecc71; transition:background .3s ease, box-shadow .3s ease;
  }
  #camWrap .eyeDot.away{ background:#c0392b; box-shadow:0 0 5px #c0392b; }

  #camGate{
    position:absolute; inset:0; z-index:55; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.94); padding:6vh 8vw; text-align:center;
  }
  #camGate.show{ display:flex; }
  #camGate .box{ max-width:26em; display:flex; flex-direction:column; gap:1.2em; align-items:center; }
  #camGate p{ color:#ccc; font-size:0.92rem; line-height:1.75em; letter-spacing:0.02em; margin:0; }
  #camGate .row{ display:flex; gap:0.8em; justify-content:center; }
  #camGate button{
    padding:0.75em 1.8em; background:transparent; border:1px solid rgba(255,255,255,0.25);
    color:#ddd; font-size:0.78rem; letter-spacing:0.18em; text-transform:uppercase; cursor:pointer;
    font-family:inherit;
  }
  #camGate .miniclose{
    border:none; color:#555; font-size:0.7rem; text-decoration:underline; letter-spacing:0.1em; background:none;
    padding:0.4em;
  }
  #camGate .eye{
    width:38px; height:38px; border-radius:50%; border:1px solid rgba(255,255,255,0.2);
    display:flex; align-items:center; justify-content:center; color:#888; font-size:1.1rem;
  }

  #gear{
    position:absolute; top:1em; left:1em; z-index:60; width:34px; height:34px;
    border-radius:50%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
    color:#999; display:flex; align-items:center; justify-content:center; font-size:0.9rem; cursor:pointer;
  }

  @media (prefers-reduced-motion: reduce){ #flashLayer{ transition:none; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="hint">tiens</div>
  <button id="turnBtn">se retourner</button>

  <div id="recDot"></div>
  <div id="fakeOS">
    <span id="fosTime">00:00</span>
    <span id="fosBatt">100%</span>
  </div>
  <div id="fakeNotif"><b id="fnFrom">Inconnu</b><span id="fnMsg"></span></div>

  <div id="camWrap"><video id="camVideo" autoplay playsinline muted></video><div class="eyeDot" id="eyeDot"></div><div class="camlabel">● REC</div></div>

  <div id="veil">
    <div class="title" id="titleText">VEILLE</div>
    <div class="flavor" id="flavorText">il a besoin de te voir pour commencer.</div>
    <div class="stat" id="statText"></div>
    <button class="startbtn" id="startBtn">entrer</button>
    <div class="miniline"><button id="resetBtn">tout oublier</button></div>
  </div>

  <div id="diedScreen">
    <div class="diedTitle" id="diedTitle">IL T'A EU</div>
    <div class="diedSub" id="diedSub"></div>
  </div>

  <div id="flashLayer"></div>

  <div id="camGate">
    <div class="box">
      <div class="eye">◉</div>
      <p id="camGateText">il a besoin de te voir pour commencer. le flux reste entièrement sur cet appareil — rien n'est envoyé ni enregistré. si tu détournes le regard puis reviens, il le saura.</p>
      <div class="row"><button id="camGateBtn">autoriser</button></div>
      <button class="miniclose" id="camGateClose">retour</button>
    </div>
  </div>

  <div id="gear" title="paramètres">☾</div>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   VEILLE — utilitaires & état persistant
   ============================================================ */
const SAVE_KEY = "veille_save_v2";
const now = () => Date.now();
const REDUCE_MOTION = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function randRange(a,b){ return a + Math.random()*(b-a); }

function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    firstVisit: now(), lastVisit: now(), deaths: 0,
    longestSurvivalMs: 0, totalSessions: 0, reduceEffects: REDUCE_MOTION
  };
}
function writeSave(s){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(s)); }catch(e){} }
let save = loadSave();

function fmtDuration(ms){
  const s = Math.floor(ms/1000);
  if(s < 60) return s + " seconde" + (s===1?"":"s");
  const m = Math.floor(s/60);
  if(m < 60) return m + " minute" + (m===1?"":"s");
  const h = Math.floor(m/60);
  if(h < 24) return h + " heure" + (h===1?"":"s");
  const d = Math.floor(h/24);
  return d + " jour" + (d===1?"":"s");
}

/* ============================================================
   Canvas setup
   ============================================================ */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W*DPR); canvas.height = Math.floor(H*DPR);
  canvas.style.width = W+"px"; canvas.style.height = H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize", resize);
resize();

/* ============================================================
   Audio (100% procédural, aucun fichier externe)
   ============================================================ */
let actx=null, droneGain=null, noiseGain=null, masterGain=null, noiseSrc=null, lfo=null, lfoGain=null, filter=null;
function ensureAudio(){
  if(actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  actx = new AC();
  masterGain = actx.createGain(); masterGain.gain.value = 0.5;
  masterGain.connect(actx.destination);

  const osc = actx.createOscillator();
  osc.type = "sine"; osc.frequency.value = 55;
  droneGain = actx.createGain(); droneGain.gain.value = 0.05;
  osc.connect(droneGain); droneGain.connect(masterGain);
  osc.start();

  lfo = actx.createOscillator(); lfo.frequency.value = 0.18;
  lfoGain = actx.createGain(); lfoGain.gain.value = 0.03;
  lfo.connect(lfoGain); lfoGain.connect(droneGain.gain);
  lfo.start();

  const bufSize = actx.sampleRate * 2;
  const buf = actx.createBuffer(1, bufSize, actx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1)*0.6;
  noiseSrc = actx.createBufferSource(); noiseSrc.buffer = buf; noiseSrc.loop = true;
  filter = actx.createBiquadFilter(); filter.type = "lowpass"; filter.frequency.value = 300;
  noiseGain = actx.createGain(); noiseGain.gain.value = 0.02;
  noiseSrc.connect(filter); filter.connect(noiseGain); noiseGain.connect(masterGain);
  noiseSrc.start();
}
function setDread(level){
  if(!actx) return;
  const t = actx.currentTime;
  droneGain.gain.setTargetAtTime(0.04 + level*0.09, t, 0.4);
  noiseGain.gain.setTargetAtTime(0.015 + level*0.08, t, 0.4);
  filter.frequency.setTargetAtTime(250 + level*1800, t, 0.5);
  lfo.frequency.setTargetAtTime(0.18 + level*0.6, t, 1);
}
function whisperSound(intensity){
  if(!actx) return;
  const t = actx.currentTime;
  const bufSize = Math.floor(actx.sampleRate*0.35);
  const buf = actx.createBuffer(1,bufSize,actx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1);
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type = "bandpass";
  f.frequency.setValueAtTime(1800,t);
  f.frequency.exponentialRampToValueAtTime(300, t+0.3);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.14*intensity, t+0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.35);
  src.connect(f); f.connect(g); g.connect(masterGain);
  src.start(t);
}
function scareSound(){
  if(!actx) return;
  const t = actx.currentTime;
  const bufSize = Math.floor(actx.sampleRate * 0.6);
  const buf = actx.createBuffer(1, bufSize, actx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1);
  const src = actx.createBufferSource(); src.buffer = buf;
  const g = actx.createGain(); g.gain.setValueAtTime(0.55, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.55);
  const f = actx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=900;
  src.connect(f); f.connect(g); g.connect(masterGain);
  src.start(t);

  const o = actx.createOscillator(); o.type="sawtooth";
  o.frequency.setValueAtTime(220, t);
  o.frequency.exponentialRampToValueAtTime(40, t+0.5);
  const g2 = actx.createGain(); g2.gain.setValueAtTime(0.35, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t+0.6);
  o.connect(g2); g2.connect(masterGain);
  o.start(t); o.stop(t+0.65);

  const o3 = actx.createOscillator(); o3.type="square";
  o3.frequency.setValueAtTime(320, t);
  o3.frequency.exponentialRampToValueAtTime(1500, t+0.15);
  o3.frequency.exponentialRampToValueAtTime(160, t+0.55);
  const g3 = actx.createGain(); g3.gain.setValueAtTime(0.0001, t);
  g3.gain.linearRampToValueAtTime(0.32, t+0.05);
  g3.gain.exponentialRampToValueAtTime(0.0001, t+0.6);
  o3.connect(g3); g3.connect(masterGain);
  o3.start(t); o3.stop(t+0.65);
}

/* ============================================================
   Vibration (mobile)
   ============================================================ */
function vibrate(pattern){
  if(!save.reduceEffects && navigator.vibrate) navigator.vibrate(pattern);
}

/* ============================================================
   État de jeu
   ============================================================ */
const STATE = { TITLE:"title", PLAYING:"playing", DEAD:"dead" };
let state = STATE.TITLE;

let held = false;
let light = 1;
let threat = 0;
let panic = 0;
let sessionStart = 0;
let sessionElapsed = 0;
let actPhase = 1;
let paused = false;
let lastFrame = 0;
let hiddenAt = 0;

let pointerEvents = [];
let entitySeed = Math.random()*1000;
let glitchTimer = randRange(18,34);

let nextGlimpseAt = 0;
let nextSurgeAt = 0;
let nearMissCooldownUntil = 0;
let glimpseUntil = 0, glimpseX=0, glimpseY=0, glimpseSize=0;
let nearMissUntil = 0;
let jumpscareUntil = 0;
let shakeUntil = 0;
let crackUntil = 0, crackSeed = 0;
let subliminalUntil = 0, subliminalText = "", subliminalAngle = 0;

let turnedAround = false;
let turnPromptShown = false;
let turnPromptAt = 0;
let somethingBehind = false;

const SUBLIMINAL_AMBIENT = ["derrière toi","il respire","ne bouge pas","chut","il sait","reste calme","trop tard","regarde"];
const SUBLIMINAL_DEATH = ["NON.","IL T'A EU.","COURS.","TROP TARD.","REGARDE-LE."];

function difficultyMul(){ return 1 + Math.min(save.deaths, 12) * 0.045; }
function startingThreat(){
  const hours = (now() - save.lastVisit) / 3600000;
  return Math.min(0.42, Math.log2(1+hours) * 0.09);
}

/* ============================================================
   Titre — texte qui se souvient
   ============================================================ */
function buildTitleFlavor(){
  const delta = now() - save.lastVisit;
  const d = save.deaths;
  let msg;
  if(save.totalSessions === 0){
    msg = "il a besoin de te voir pour commencer. autorise la caméra, puis pose ton doigt sur l'écran et ne le retire pas.";
  } else if(delta < 60000){
    msg = "tu es encore là. il n'a pas eu le temps de partir non plus.";
  } else if(delta < 3600000){
    msg = "tu es parti " + fmtDuration(delta) + ". il a attendu, immobile, tourné vers la porte.";
  } else if(delta < 86400000){
    msg = "ça fait " + fmtDuration(delta) + ". quelque chose a bougé pendant ton absence.";
  } else {
    msg = "ça fait " + fmtDuration(delta) + ". il a eu largement le temps de grandir.";
  }
  const tiers = [
    "",
    "il connaît le son de ta respiration, maintenant.",
    "il n'a plus besoin du noir pour te trouver.",
    "il compte les fois où tu as lâché prise.",
    "il n'attend plus que tu recommences.",
    "il n'est plus vraiment dans l'écran.",
  ];
  const tierIdx = Math.min(Math.floor(d/3), tiers.length-1);
  document.getElementById("flavorText").textContent = msg + (tierIdx>0 ? "  " + tiers[tierIdx] : "");
  const stat = document.getElementById("statText");
  const parts = [];
  if(d>0) parts.push("morts : "+d);
  if(save.longestSurvivalMs>0) parts.push("record : "+fmtDuration(save.longestSurvivalMs));
  stat.textContent = parts.join("   ·   ");

  const titleEl = document.getElementById("titleText");
  titleEl.style.letterSpacing = (0.35 + Math.min(d,10)*0.01) + "em";
  titleEl.style.textShadow = d>6 ? "0 0 22px rgba(180,20,20,0.25), 2px 0 0 rgba(255,0,0,0.12), -2px 0 0 rgba(0,255,255,0.1)" : "0 0 18px rgba(255,255,255,0.08)";
}

/* ============================================================
   Visage procédural de l'entité
   ============================================================ */
function drawFace(x,y,size,alpha,jitter,fillStyle){
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
  ctx.translate(x,y);
  ctx.fillStyle = fillStyle || "#050505";

  ctx.beginPath();
  const pts = 16;
  for(let i=0;i<=pts;i++){
    const a = (i/pts) * Math.PI*2;
    const jr = size*(0.5+0.5*Math.sin(a*2.7+entitySeed)) + (Math.random()-0.5)*jitter;
    const px = Math.cos(a)*jr*0.62;
    const py = Math.sin(a)*jr;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = "#f3f3f3";
  const eyeY = -size*0.08, eyeDX = size*0.22;
  const eyeW = size*0.09*(0.7+Math.random()*0.6), eyeH = size*0.15*(0.6+Math.random()*0.8);
  ctx.beginPath(); ctx.ellipse(-eyeDX,eyeY,eyeW,eyeH,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(eyeDX,eyeY,eyeW*0.8,eyeH*0.9,0,0,Math.PI*2); ctx.fill();

  ctx.fillStyle = "#000";
  ctx.beginPath();
  const mw = size*0.32, my = size*0.28;
  ctx.moveTo(-mw,my);
  for(let i=0;i<=8;i++){
    const px = -mw + (mw*2*i/8);
    const py = my + Math.sin(i*1.7+entitySeed)*size*0.05 + (Math.random()-0.5)*jitter*0.6;
    ctx.lineTo(px,py);
  }
  ctx.lineTo(mw,my+size*0.14); ctx.lineTo(-mw,my+size*0.14);
  ctx.closePath(); ctx.fill();

  ctx.restore();
}

/* ============================================================
   Rendu
   ============================================================ */
function drawNormalScene(){
  ctx.fillStyle = "#000";
  ctx.fillRect(0,0,W,H);

  const cx = W/2, cy = H*0.46;
  const baseRadius = Math.max(W,H) * (0.16 + light*0.30 - threat*0.10);
  const radius = Math.max(30, baseRadius);

  const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,radius*1.9);
  const lum = 0.10 + light*0.16;
  grad.addColorStop(0, `rgba(255,244,222,${0.55*light+0.08})`);
  grad.addColorStop(0.35, `rgba(120,100,90,${lum})`);
  grad.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  if(threat > 0.05){
    const distFromLight = radius * (1.5 - threat*1.05);
    const ang = Math.sin(entitySeed + performance.now()*0.00025) * 0.6;
    const ex = cx + Math.cos(ang) * distFromLight * 0.9;
    const ey = cy + Math.sin(ang*0.6) * distFromLight * 0.35 + H*0.06;
    const size = 40 + threat*(H*0.5);
    const jitter = threat*16;
    drawFace(ex, ey, size, Math.min(0.92, threat*0.95+0.05), jitter, "#050505");
  }

  if(now() < glimpseUntil){
    drawFace(glimpseX, glimpseY, glimpseSize, 0.85, 10, "#020202");
  }
  if(now() < nearMissUntil){
    const t = 1 - Math.max(0,(nearMissUntil-now())/480);
    const size = Math.min(W,H) * (0.25 + 0.35*Math.sin(t*Math.PI));
    drawFace(W/2, H*0.48, size, 0.7*Math.sin(t*Math.PI), 20, "#0a0000");
  }

  if(!save.reduceEffects){
    const grainCount = Math.floor(35 + threat*120);
    ctx.fillStyle = "rgba(255,255,255,0.035)";
    for(let i=0;i<grainCount;i++){
      const gx = Math.random()*W, gy = Math.random()*H;
      ctx.fillRect(gx,gy,1,1);
    }
  }

  const vr = Math.floor(0+threat*70), vb = Math.floor(0+threat*14);
  const vgn = ctx.createRadialGradient(cx,cy,radius*0.9,cx,cy,Math.max(W,H)*0.75);
  vgn.addColorStop(0,"rgba(0,0,0,0)");
  vgn.addColorStop(1,`rgba(${vr},0,${vb},0.58)`);
  ctx.fillStyle = vgn;
  ctx.fillRect(0,0,W,H);
}

function drawTurnedScene(){
  ctx.fillStyle = "#050505";
  ctx.fillRect(0,0,W,H);
  const cx=W/2, cy=H*0.5;
  const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*0.6);
  grad.addColorStop(0,"rgba(40,35,35,0.35)");
  grad.addColorStop(1,"rgba(0,0,0,0.95)");
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

  if(somethingBehind){
    const pulse = 0.28 + 0.15*Math.sin(performance.now()*0.004);
    drawFace(cx + Math.sin(performance.now()*0.0006)*W*0.06, cy, Math.min(W,H)*0.22, pulse, 10, "#000");
  }
  if(!save.reduceEffects){
    ctx.fillStyle = "rgba(255,255,255,0.03)";
    for(let i=0;i<50;i++){ ctx.fillRect(Math.random()*W, Math.random()*H, 1, 1); }
  }
}

function drawJumpscare(){
  ctx.fillStyle = "#000";
  ctx.fillRect(0,0,W,H);
  const dur = save.reduceEffects ? 400 : 850;
  const remain = Math.max(0, jumpscareUntil-now());
  const t = 1 - remain/dur;
  const size = Math.min(W,H) * (0.5 + 0.55*Math.min(1,t*3));
  const cx = W/2 + (save.reduceEffects?0:(Math.random()-0.5)*10);
  const cy = H/2 + (save.reduceEffects?0:(Math.random()-0.5)*10);

  if(!save.reduceEffects){
    ctx.globalCompositeOperation = "lighter";
    drawFace(cx-6, cy, size, 0.5, 26, "rgba(255,0,60,0.9)");
    drawFace(cx+6, cy, size, 0.5, 26, "rgba(0,230,255,0.7)");
    ctx.globalCompositeOperation = "source-over";
  }
  drawFace(cx, cy, size, 1, save.reduceEffects?6:22, "#050505");

  if(!save.reduceEffects && Math.random()<0.5){
    ctx.fillStyle = "rgba(255,255,255,0.06)";
    ctx.fillRect(0,0,W,H);
  }
}

function drawSubliminalText(){
  ctx.save();
  ctx.translate(W/2, H*0.4);
  ctx.rotate(subliminalAngle*Math.PI/180);
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.font = "700 " + Math.round(Math.min(W,H)*0.075) + "px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(subliminalText, 0, 0);
  ctx.restore();
}

function drawCrack(){
  const alpha = Math.max(0,(crackUntil-now())/900) * 0.45;
  if(alpha<=0) return;
  ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
  ctx.lineWidth = 1.5;
  let x = W*0.5 + ((crackSeed%50)-25), y = 0;
  ctx.beginPath(); ctx.moveTo(x,y);
  let rng = crackSeed || 1;
  for(let i=0;i<9;i++){
    rng = (rng*9301+49297)%233280;
    const rx = rng/233280;
    x += (rx-0.5)*W*0.09;
    y += H/9;
    ctx.lineTo(x,y);
  }
  ctx.stroke();
}

function drawScene(){
  const shaking = now() < shakeUntil;
  let ox=0, oy=0;
  if(shaking){
    const mag = save.reduceEffects ? 3 : 18;
    ox = (Math.random()-0.5)*mag; oy = (Math.random()-0.5)*mag;
  }
  ctx.save();
  if(shaking) ctx.translate(ox,oy);

  if(now() < jumpscareUntil){
    drawJumpscare();
  } else if(turnedAround){
    drawTurnedScene();
  } else {
    drawNormalScene();
    if(now() < crackUntil) drawCrack();
    if(now() < subliminalUntil) drawSubliminalText();
  }

  ctx.restore();
}

function loop(ts){
  requestAnimationFrame(loop);
  if(!lastFrame) lastFrame = ts;
  let dt = (ts - lastFrame)/1000;
  lastFrame = ts;
  dt = Math.min(dt, 0.1);
  if(state === STATE.PLAYING) updateGame(dt);
  drawScene();
}
requestAnimationFrame(loop);

/* ============================================================
   Contenu ambiant
   ============================================================ */
function scheduleNextGlimpse(){
  let range;
  if(actPhase===1) range=[11000,19000];
  else if(actPhase===2) range=[6000,11000];
  else range=[3000,7000];
  const bonus = held ? 1.6 : 1;
  nextGlimpseAt = now() + randRange(range[0],range[1]) * bonus;
}
function triggerGlimpse(){
  const edge = Math.floor(Math.random()*4);
  const margin = 0.12;
  if(edge===0){ glimpseX=randRange(margin,1-margin)*W; glimpseY=H*randRange(0.02,0.14); }
  else if(edge===1){ glimpseX=randRange(margin,1-margin)*W; glimpseY=H*randRange(0.86,0.98); }
  else if(edge===2){ glimpseX=W*randRange(0.02,0.14); glimpseY=randRange(margin,1-margin)*H; }
  else { glimpseX=W*randRange(0.86,0.98); glimpseY=randRange(margin,1-margin)*H; }
  glimpseSize = randRange(40,90) + threat*60;
  glimpseUntil = now() + randRange(110,240);
  whisperSound(0.25);
  vibrate([12]);
  if(Math.random()<0.35) flashSubliminal(SUBLIMINAL_AMBIENT[Math.floor(Math.random()*SUBLIMINAL_AMBIENT.length)]);
}
function triggerNearMiss(){
  nearMissUntil = now() + 480;
  whisperSound(0.55);
  vibrate([0,60,20,60]);
  threat = Math.max(0, threat - 0.22);
  nearMissCooldownUntil = now() + randRange(28000,48000);
}
function triggerSurge(){
  flashSubliminal("il approche");
  whisperSound(0.4);
  setTimeout(()=>{
    if(state===STATE.PLAYING && !paused){
      threat = Math.min(1, threat + randRange(0.12,0.18));
      vibrate([0,40,20,40,20,120]);
    }
  }, 700);
  nextSurgeAt = now() + randRange(38000,62000);
}
function flashSubliminal(text){
  subliminalText = text;
  subliminalAngle = randRange(-6,6);
  subliminalUntil = now() + randRange(70,130);
}
function triggerCrack(){
  crackSeed = Math.floor(Math.random()*100000)+1;
  crackUntil = now() + randRange(500,900);
}

/* ============================================================
   Logique de jeu
   ============================================================ */
function updateGame(dt){
  if(paused) return;

  sessionElapsed = now() - sessionStart;
  actPhase = sessionElapsed < 22000 ? 1 : (sessionElapsed < 65000 ? 2 : 3);
  const phaseMul = actPhase===1 ? 0.75 : (actPhase===2 ? 1.0 : 1.3);
  const dmul = difficultyMul();

  const cutoff = now() - 4000;
  pointerEvents = pointerEvents.filter(t=>t>cutoff);
  const freq = pointerEvents.length;
  const targetPanic = Math.max(0, Math.min(1, (freq-2)/6));
  panic += (targetPanic - panic) * Math.min(1, dt*1.5);

  if(held){
    light = Math.min(1, light + dt*0.32);
    const calmBonus = Math.max(0, 1-panic);
    threat = Math.max(0, threat - dt*0.075*calmBonus*(1/dmul) + dt*0.06*panic*dmul*phaseMul);
  } else {
    light = Math.max(0, light - dt*0.9);
    threat = Math.min(1, threat + dt*0.20*dmul*phaseMul);
  }

  setDread(threat);
  document.getElementById("hint").style.opacity = (sessionStart && now()-sessionStart>6000) ? "0" : "1";

  if(nextGlimpseAt===0) scheduleNextGlimpse();
  if(now() > nextGlimpseAt){ triggerGlimpse(); scheduleNextGlimpse(); }

  if(threat>0.65 && held && actPhase>=2 && now()>nearMissCooldownUntil && Math.random() < dt*0.12){
    triggerNearMiss();
  }

  if(actPhase>=2){
    if(nextSurgeAt===0) nextSurgeAt = now() + randRange(30000,45000);
    if(now() > nextSurgeAt) triggerSurge();
  }

  glitchTimer -= dt;
  const glitchIntervalMul = actPhase===3 ? 0.6 : 1;
  if(glitchTimer <= 0 && now()-sessionStart > 12000){
    triggerFakeGlitch();
    glitchTimer = randRange(18,34) * glitchIntervalMul;
    if(Math.random()<0.3) triggerCrack();
  }

  // proposition "se retourner" — une seule fois par partie
  if(!turnPromptShown && sessionElapsed > turnPromptAt){
    turnPromptShown = true;
    document.getElementById("turnBtn").classList.add("show");
  }

  if(threat >= 1){ onCaught(); }
}

function onPointerDown(){
  ensureAudio();
  if(actx && actx.state==="suspended") actx.resume();
  held = true;
  pointerEvents.push(now());
}
function onPointerUp(){ held = false; }

/* ============================================================
   Contrôles : tactile + souris + espace
   ============================================================ */
const stage = document.getElementById("app");
stage.addEventListener("pointerdown", ()=>{ if(state===STATE.PLAYING && !paused){ onPointerDown(); } });
window.addEventListener("pointerup", ()=>{ onPointerUp(); });
window.addEventListener("pointercancel", ()=>{ onPointerUp(); });
window.addEventListener("keydown", (e)=>{
  if(e.code === "Space" && state===STATE.PLAYING && !paused){ e.preventDefault(); onPointerDown(); }
});
window.addEventListener("keyup", (e)=>{ if(e.code === "Space"){ onPointerUp(); } });
window.addEventListener("blur", ()=>{ onPointerUp(); });

/* ============================================================
   "Se retourner" — mini-mécanique, une fois par partie
   ============================================================ */
document.getElementById("turnBtn").addEventListener("click", (e)=>{
  e.stopPropagation();
  if(state !== STATE.PLAYING) return;
  const btn = document.getElementById("turnBtn");
  if(!turnedAround){
    turnedAround = true;
    paused = true;
    somethingBehind = Math.random() < 0.45;
    whisperSound(somethingBehind ? 0.55 : 0.2);
    vibrate([20]);
    btn.textContent = "se retourner";
  } else {
    const line = somethingBehind
      ? "tu l'as vu juste avant de te retourner."
      : "il n'y avait rien derrière toi. il était déjà devant.";
    btn.classList.remove("show");
    onCaught(line);
  }
});

/* ============================================================
   Caméra + détection du regard (face-api.js, 100% local)
   ============================================================ */
let camStream = null;
let everGranted = false;
let modelsReady = false;
let faceApiScriptReady = false;
let detectTimer = null;
let looking = true;
let awaySince = 0;
let gazeGraceUntil = 0;
let lastGazeScareAt = 0;
const AWAY_MIN_MS = 550;
const GAZE_SCARE_COOLDOWN = 4000;

function loadFaceApiScript(){
  return new Promise((resolve,reject)=>{
    if(faceApiScriptReady || window.faceapi){ faceApiScriptReady = true; resolve(); return; }
    const s = document.createElement("script");
    s.src = "lib/face-api.min.js";
    s.onload = ()=>{ faceApiScriptReady = true; resolve(); };
    s.onerror = ()=> reject(new Error("face-api-load-failed"));
    document.head.appendChild(s);
  });
}
async function loadModels(){
  if(modelsReady) return;
  await window.faceapi.nets.tinyFaceDetector.loadFromUri("models");
  modelsReady = true;
}
async function acquireCamera(){
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    const err = new Error("no-camera-api"); throw err;
  }
  const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}, audio:false});
  camStream = stream;
  everGranted = true;
  const v = document.getElementById("camVideo");
  v.srcObject = stream;
  try{ await v.play(); }catch(e){}
  document.getElementById("camWrap").classList.add("show");
}
function stopCamera(){
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  document.getElementById("camWrap").classList.remove("show");
}

function showCamGate(kind, text){
  const g = document.getElementById("camGate");
  const t = document.getElementById("camGateText");
  const btn = document.getElementById("camGateBtn");
  if(kind==="ask"){
    t.textContent = "il a besoin de te voir pour commencer. le flux reste entièrement sur cet appareil — rien n'est envoyé ni enregistré. si tu détournes le regard puis reviens, il le saura.";
    btn.textContent = "autoriser"; btn.style.display = "inline-block";
  } else if(kind==="loading"){
    t.textContent = "il ouvre les yeux…";
    btn.style.display = "none";
  } else if(kind==="denied"){
    t.textContent = text || "il ne peut pas te voir.";
    btn.textContent = "réessayer"; btn.style.display = "inline-block";
  }
  g.classList.add("show");
}
function hideCamGate(){ document.getElementById("camGate").classList.remove("show"); }

let starting = false;
async function tryStart(){
  if(starting) return;
  starting = true;
  if(!modelsReady || !camStream){
    showCamGate("loading");
    try{
      if(!camStream) await acquireCamera();
      await loadFaceApiScript();
      if(!modelsReady) await loadModels();
    }catch(err){
      starting = false;
      let msg = "il n'a pas réussi à te voir. réessaie.";
      if(err && err.name === "NotAllowedError") msg = "caméra refusée. autorise-la dans les réglages du navigateur, puis réessaie.";
      else if(err && err.message === "no-camera-api") msg = "aucune caméra détectée sur cet appareil. impossible de jouer sans qu'il puisse te voir.";
      else if(err && err.message === "face-api-load-failed") msg = "le module de vision n'a pas pu charger. vérifie ta connexion et réessaie.";
      showCamGate("denied", msg);
      return;
    }
  }
  hideCamGate();
  startDetectionLoop();
  startGame();
  starting = false;
}

document.getElementById("startBtn").addEventListener("click", (e)=>{
  e.stopPropagation();
  if(!everGranted){ showCamGate("ask"); }
  else { tryStart(); }
});
document.getElementById("camGateBtn").addEventListener("click", (e)=>{
  e.stopPropagation();
  tryStart();
});
document.getElementById("camGateClose").addEventListener("click", (e)=>{
  e.stopPropagation();
  hideCamGate();
});
document.getElementById("camGate").addEventListener("pointerdown", (e)=>{ e.stopPropagation(); });

function startDetectionLoop(){
  stopDetectionLoop();
  looking = true; awaySince = 0;
  gazeGraceUntil = now() + 3500;
  detectTimer = setInterval(async ()=>{
    if(state!==STATE.PLAYING || paused || document.hidden || !camStream || !window.faceapi) return;
    const v = document.getElementById("camVideo");
    if(!v || v.readyState < 2) return;
    try{
      const result = await window.faceapi.detectSingleFace(v, new window.faceapi.TinyFaceDetectorOptions({inputSize:160, scoreThreshold:0.5}));
      handleGaze(!!result);
    }catch(e){ /* ignore une frame ratée */ }
  }, 320);
}
function stopDetectionLoop(){ if(detectTimer){ clearInterval(detectTimer); detectTimer=null; } }

function handleGaze(seen){
  const eyeDot = document.getElementById("eyeDot");
  if(eyeDot) eyeDot.classList.toggle("away", !seen);
  if(!seen){
    if(awaySince===0) awaySince = now();
    looking = false;
  } else {
    if(!looking && awaySince>0){
      const awayFor = now() - awaySince;
      if(awayFor > AWAY_MIN_MS && now() > gazeGraceUntil && now()-lastGazeScareAt > GAZE_SCARE_COOLDOWN && state===STATE.PLAYING && !paused){
        lastGazeScareAt = now();
        onCaught("tu as détourné le regard. il en a profité.");
      }
    }
    awaySince = 0;
    looking = true;
  }
}

/* ============================================================
   Visibilité de l'onglet : coupe la caméra, punit l'absence
   ============================================================ */
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden){
    if(state===STATE.PLAYING){ hiddenAt = now(); }
    stopCamera();
    stopDetectionLoop();
  } else {
    if(state===STATE.PLAYING){
      const away = now() - hiddenAt;
      const awaySec = away/1000;
      const bump = Math.min(0.6, awaySec*0.01);
      threat = Math.min(1, threat + bump);
      hiddenAt = 0;
      if(awaySec > 4) showFakeNotifOnReturn(away);
      acquireCamera().then(()=>{ startDetectionLoop(); }).catch(()=>{});
      if(threat>=1) onCaught();
    }
  }
});

/* ============================================================
   Faux glitchs d'interface (cosmétiques uniquement)
   ============================================================ */
let batteryLevel = 100;
if(navigator.getBattery){
  navigator.getBattery().then(b=>{
    batteryLevel = Math.round(b.level*100);
    b.addEventListener("levelchange", ()=>{ batteryLevel = Math.round(b.level*100); });
  }).catch(()=>{});
}
function updateFakeClock(){
  const d = new Date();
  const hh = String(d.getHours()).padStart(2,"0");
  const mm = String(d.getMinutes()).padStart(2,"0");
  document.getElementById("fosTime").textContent = hh+":"+mm;
  document.getElementById("fosBatt").textContent = batteryLevel + "%";
}
setInterval(updateFakeClock, 1000);

const glitchLines = [
  "il fait plus froid ici qu'il y a une minute.",
  "quelqu'un respire, mais ce n'est pas toi.",
  "1 nouvelle présence détectée.",
  "ne te retourne pas.",
  "il sait que tu lis ceci.",
  "batterie : ne le laisse pas s'éteindre.",
];
function triggerFakeGlitch(){
  const fosEl = document.getElementById("fakeOS");
  const rec = document.getElementById("recDot");
  const roll = Math.random();
  if(roll < 0.5){
    fosEl.style.opacity = "1";
    const battEl = document.getElementById("fosBatt");
    const realBatt = batteryLevel;
    let fake = realBatt;
    const iv = setInterval(()=>{ fake = Math.max(-1, fake-Math.floor(randRange(3,14))); battEl.textContent = fake+"%"; if(fake<=0) clearInterval(iv); }, 90);
    setTimeout(()=>{ fosEl.style.opacity="0"; battEl.textContent = realBatt+"%"; }, 1400);
    vibrate([15]);
  } else {
    showFakeNotif(glitchLines[Math.floor(Math.random()*glitchLines.length)]);
  }
  if(Math.random()<0.35){
    rec.style.opacity = "1";
    setTimeout(()=>{ rec.style.opacity="0"; }, randRange(400,900));
  }
}
function showFakeNotif(text, from){
  const n = document.getElementById("fakeNotif");
  document.getElementById("fnFrom").textContent = from || "Système";
  document.getElementById("fnMsg").textContent = text;
  n.classList.add("show");
  setTimeout(()=>{ n.classList.remove("show"); }, 2600);
}
function showFakeNotifOnReturn(awayMs){
  showFakeNotif("tu étais parti " + fmtDuration(awayMs) + ". il s'est rapproché.", "VEILLE");
}

/* ============================================================
   Mort / capture
   ============================================================ */
function onCaught(customLine){
  if(state === STATE.DEAD) return;
  state = STATE.DEAD;
  const survived = now() - sessionStart;
  save.deaths += 1;
  save.longestSurvivalMs = Math.max(save.longestSurvivalMs, survived);
  save.lastVisit = now();
  writeSave(save);
  stopCamera();
  stopDetectionLoop();

  const jsDuration = save.reduceEffects ? 400 : 850;
  jumpscareUntil = now() + jsDuration;
  shakeUntil = jumpscareUntil;
  flashSubliminal(SUBLIMINAL_DEATH[Math.floor(Math.random()*SUBLIMINAL_DEATH.length)]);
  scareSound();
  vibrate([0,90,30,90,30,260]);
  flashScreen();

  setTimeout(()=>{
    const diedSub = document.getElementById("diedSub");
    const lines = [
      "tu as lâché prise.",
      "tu as paniqué. il a senti chaque battement.",
      "il attendait juste ça.",
      "tu croyais que rester calme suffirait.",
    ];
    const base = customLine || lines[Math.floor(Math.random()*lines.length)];
    diedSub.textContent = base + "  —  survécu " + fmtDuration(survived) + ".";
    document.getElementById("diedScreen").classList.add("show");
  }, 550);

  setTimeout(()=>{
    document.getElementById("diedScreen").classList.remove("show");
    backToTitle();
  }, 3200);
}
function flashScreen(){
  const f = document.getElementById("flashLayer");
  if(save.reduceEffects){ f.style.opacity="0.25"; setTimeout(()=>f.style.opacity="0",180); return; }
  let n=0;
  const iv = setInterval(()=>{
    f.style.opacity = (n%2===0) ? "0.9" : "0";
    n++;
    if(n>5){ clearInterval(iv); f.style.opacity="0"; }
  }, 55);
}

/* ============================================================
   Transitions d'écran
   ============================================================ */
function backToTitle(){
  state = STATE.TITLE;
  light = 1; threat = 0; panic = 0; held = false; paused = false; turnedAround = false;
  buildTitleFlavor();
  document.getElementById("veil").classList.remove("hidden");
  document.getElementById("turnBtn").classList.remove("show");
}
function startGame(){
  ensureAudio();
  if(actx && actx.state==="suspended") actx.resume();
  save.totalSessions += 1;
  save.lastVisit = now();
  writeSave(save);

  state = STATE.PLAYING;
  sessionStart = now();
  sessionElapsed = 0;
  actPhase = 1;
  light = 1;
  threat = startingThreat();
  panic = 0;
  entitySeed = Math.random()*1000;
  glitchTimer = randRange(16,26);
  pointerEvents = [];
  held = false;
  paused = false;

  nextGlimpseAt = 0; nextSurgeAt = 0; nearMissCooldownUntil = 0;
  glimpseUntil = 0; nearMissUntil = 0; jumpscareUntil = 0; shakeUntil = 0;
  crackUntil = 0; subliminalUntil = 0;

  turnedAround = false; turnPromptShown = false; somethingBehind = false;
  turnPromptAt = randRange(15000,50000);
  document.getElementById("turnBtn").classList.remove("show");

  document.getElementById("veil").classList.add("hidden");
  document.getElementById("hint").style.opacity = "1";
}

document.getElementById("resetBtn").addEventListener("click", (e)=>{
  e.stopPropagation();
  try{ localStorage.removeItem(SAVE_KEY); }catch(err){}
  save = loadSave();
  buildTitleFlavor();
});

/* ============================================================
   Paramètres (réduire les effets)
   ============================================================ */
document.getElementById("gear").addEventListener("click", (e)=>{
  e.stopPropagation();
  save.reduceEffects = !save.reduceEffects;
  writeSave(save);
  showFakeNotif(save.reduceEffects ? "effets réduits." : "effets normaux.", "VEILLE");
});

/* ============================================================
   Sauvegarde périodique
   ============================================================ */
setInterval(()=>{
  if(state===STATE.PLAYING){ save.lastVisit = now(); writeSave(save); }
}, 5000);
window.addEventListener("beforeunload", ()=>{ save.lastVisit = now(); writeSave(save); });

/* ============================================================
   Service worker (offline / PWA)
   ============================================================ */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

buildTitleFlavor();

})();
</script>
